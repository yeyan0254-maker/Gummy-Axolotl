    const isSquinting = (pullLen > 0.34) || (this.squishAmt > 0.45) || (this.eatHappyTimer > 0) || (this.rubHappyTimer > 0);
    let eyeScaleY = 1.0;
    if (isSquinting){
      eyeScaleY = 0.22;
    } else if (this.blinkDur > 0){
      const phase = this.blinkDur / 0.16;
      eyeScaleY = 1.0 - Math.sin(phase * Math.PI) * 0.90;
    }
    for (const eye of this.eyeMeshes){
      eye.scale.y = lerp(eye.scale.y, eyeScaleY, clamp(dt * 24, 0, 1));
    }

    // 6. 生命感微动（小鼠标凝视 + 唱歌微昂 + 缺味点头 + 乐团节拍伴舞 + 慵懒东张西望）
    const excited = (this.fizzTimer > 0) || (fireflyMode && fireflyState.active && !this.isGrabbed);
    const isEnsembleSway = musicBox.playing && (this.curAiState === 'P5.5' || this.curAiState === 'P6');
    const swayVal = isEnsembleSway ? Math.sin(beatPhase * TAU) : 0;

    const wave = elapsed * (2.2 + wobble * 0.8 + (excited ? 2.2 : 0)) + this.phase;
    const isMouseFresh = (performance.now() - mouse.activeAt) < 3500;
    const lookX = isMouseFresh ? mouse.x * 0.28 : (Math.sin(wave * 0.5) * 0.12 + this.idleLookBias);
    const lookY = isMouseFresh ? mouse.y * 0.16 : 0;

    const headPullLift = this.isGrabbed ? clamp(this.pullBiasZ * 0.28, -0.22, 0.35) : 0;
    const singTilt = this.singPulse * 0.24 - Math.sin(this.nodPulse * Math.PI) * 0.22;
    this.headTiltY = lerp(this.headTiltY, lookX + this.tailBend * 0.35, clamp(dt * 6, 0, 1));
    this.headTiltX = lerp(this.headTiltX, -lookY - headPullLift - singTilt, clamp(dt * 8, 0, 1));
    const headRoll = Math.sin(wave) * 0.05 + swayVal * 0.13 + (this.rubHappyTimer > 0 ? Math.sin(elapsed * 14) * 0.10 : 0);
    this.headGroup.rotation.set(this.headTiltX, this.headTiltY, headRoll);

    // 外鳃绽放（唱歌 / 被撸 / 抓取 / 开心）
    const flare = this.singPulse * 0.34 + (this.rubHappyTimer > 0 ? 0.26 : 0) + (this.isGrabbed ? 0.16 : 0)
      + ((this.happyTimer > 0 || excited) ? Math.sin(elapsed * 18) * 0.16 : 0);
    for (const g of this.gillGroups){
      g.group.rotation.y = -g.side * (flare + Math.sin(wave * 1.3) * 0.06);
      g.group.scale.setScalar(1 + this.singPulse * 0.14);
    }

    // 尾鳍摆动（追光 / 游动 / 乐团节拍伴舞）
    const speedHoriz = Math.hypot(this.vel.x, this.vel.z);
    const tailFreq = zeroGravity ? (5.2 + speedHoriz * 2.2) : (3.6 + speedHoriz * 3.4);
    const tailAmp = 0.20 + Math.min(speedHoriz * 0.16, 0.34) + (isEnsembleSway ? 0.18 : 0);
    const happyBoost = (this.happyTimer > 0 || this.fizzTimer > 0) ? Math.sin(elapsed * 16 + this.phase) * 0.22 : 0;
    this.tailGroup.rotation.y = Math.sin(elapsed * tailFreq + this.phase) * tailAmp + this.tailBend + swayVal * 0.22 + happyBoost;
    this.tailGroup.rotation.x = this.isGrabbed && this.pullBiasZ < 0 ? clamp(this.pullVec.y * 0.35, -0.35, 0.45) : 0;

    // 四只小短腿划动（随地面踱步速度平滑提升，呈现小短腿慢踱步感）
    const legSpeed = 5.5 + speedHoriz * 4.2;
    const groundWalkBoost = (!zeroGravity && this.onFloor) ? clamp(speedHoriz * 0.24, 0, 0.22) : 0;
    const paddle = ((this.onFloor && !zeroGravity) ? 0.05 : 0.28) + groundWalkBoost;
    for (const l of this.legs){
      l.mesh.rotation.x = Math.sin(elapsed * legSpeed + l.idx * 1.5) * paddle;
    }

    // 躯干内微光八面体糖芯自转
    this.coreCandy.rotation.y += dt * 1.4;
    this.coreCandy.rotation.x += dt * 0.9;

    // 7. 瓷盘底焦散光斑（随高度衰减 + 唱歌提亮扩大）
    const restY = this.floorRestY;
    const heightAboveFloor = Math.max(0, this.pos.y - restY);
    const heightFade = clamp(1 - heightAboveFloor / 4.8, 0.14, 1.0);
    this.decal.position.set(this.pos.x, TRAY_FLOOR_Y + 0.015, this.pos.z);
    this.decal.scale.setScalar((0.92 + heightAboveFloor * 0.12 + this.singPulse * 0.26) * sxz * this.sizeScale);
    this.decalMat.opacity = clamp((0.34 * heightFade) + this.singPulse * 0.26, 0.08, 0.72);
  }

  dispose(){
    scene.remove(this.root);
    scene.remove(this.decal);
    this.headMat.dispose();
    this.torsoMat.dispose();
    this.tailMat.dispose();
    this.gillMat.dispose();
    this.coreMat.dispose();
    this.eyeMat.dispose();
    this.specMat.dispose();
    this.blushMat.dispose();
    this.smileMat.dispose();
    this.finMat.dispose();
    this.decalMat.dispose();
  }
}

/* =========================================================================
   10. 五声果冻小乐团联动与魔法糖豆系统
   ========================================================================= */
const cardPulseTimers = [0, 0, 0, 0, 0];
const ledPulseTimers = [0, 0, 0, 0, 0];

function pulseFlavorCardUI(flavorIdx){
  const card = document.querySelector(`.card[data-flavor-idx="${flavorIdx}"]`);
  if (card){
    card.classList.add('singing');
    clearTimeout(cardPulseTimers[flavorIdx]);
    cardPulseTimers[flavorIdx] = setTimeout(() => card.classList.remove('singing'), 320);
  }
  const led = document.querySelector(`.music-led[data-led-id="${flavorIdx}"]`);
  if (led){
    led.classList.add('lit');
    clearTimeout(ledPulseTimers[flavorIdx]);
    ledPulseTimers[flavorIdx] = setTimeout(() => led.classList.remove('lit'), 300);
  }
}

function handleMusicBoxNote(noteIdx, accent){
  pulseFlavorCardUI(noteIdx);
  const targetFlavor = FLAVORS[noteIdx];
  const matching = axolotls.filter(ax => ax.flavor.id === targetFlavor.id);

  if (matching.length > 0){
    matching.forEach((ax, i) => {
      // 同口味多只时错峰 0 ~ 35ms 触发，呈现灵动合唱感
      const staggerSec = i === 0 ? 0 : (0.012 + Math.random() * 0.023);
      ax.scheduleSing(staggerSec, accent);
    });
  } else {
    // 缺味兜底：香槟金瓷盘描边柔和微闪 + 全场空闲软糖轻点头
    trayGoldPulse = 1.0;
    for (const ax of axolotls){
      if (ax.curAiState === 'P5.5' || ax.curAiState === 'P6'){
        ax.nodPulse = 0.85;
      }
    }
  }
}

const musicBox = new PentatonicMusicBox(sfx, handleMusicBoxNote);

function disposeCandyObj(cd){
  scene.remove(cd.group);
  cd.materials.forEach(m => m.dispose());
}

function resolveCandyType(mode){
  if (mode !== 'random') return mode;
  const r = Math.random();
  if (r < 0.25) return 'normal';
  if (r < 0.50) return 'rainbow';
  if (r < 0.75) return 'fizz';
  return 'size';
}

function spawnLooseCandy(x, z, mode = selectedCandyMode, customY = null){
  if (looseCandies.length >= MAX_LOOSE_CANDIES){
    const old = looseCandies.shift();
    disposeCandyObj(old);
  }
  const type = resolveCandyType(mode);
  const posClamped = clampToTrayRoundedRect(x, z, 0.45);
  const group = new THREE.Group();
  const materials = [];

  let color = FEED_CANDY_COLORS[(Math.random() * FEED_CANDY_COLORS.length) | 0];
  if (type === 'rainbow') color = 0xff7aa2;
  if (type === 'fizz') color = 0x56f0ff;
  if (type === 'size') color = 0xffcb47;

  const coreMat = new THREE.MeshPhysicalMaterial({
    color,
    emissive: new THREE.Color(color).multiplyScalar(type === 'normal' ? 0.30 : 0.45),
    roughness: 0.12,
    clearcoat: 1.0,
    clearcoatRoughness: 0.05,
  });
  materials.push(coreMat);

  const coreMesh = new THREE.Mesh(sharedGeos.looseCandy, coreMat);
  coreMesh.castShadow = true;
  group.add(coreMesh);

  let haloMesh = null;
  let haloMat = null;
  if (type === 'rainbow' || type === 'fizz'){
    haloMat = new THREE.MeshBasicMaterial({
      color: type === 'fizz' ? 0x9cf7ff : 0xffffff,
      transparent: true,
      opacity: 0.72,
    });
    materials.push(haloMat);
    haloMesh = new THREE.Mesh(sharedGeos.candyHalo, haloMat);
    haloMesh.rotation.x = Math.PI * 0.35;
    group.add(haloMesh);
  } else if (type === 'size'){
    haloMat = new THREE.MeshPhysicalMaterial({
      color: 0x62e6b8,
      emissive: new THREE.Color(0x62e6b8).multiplyScalar(0.32),
      roughness: 0.18,
      clearcoat: 1.0,
    });
    materials.push(haloMat);
    haloMesh = new THREE.Mesh(sharedGeos.sizeRing, haloMat);
    haloMesh.rotation.x = Math.PI * 0.5;
    group.add(haloMesh);
  }

  const startY = (customY !== null)
    ? clamp(customY, TRAY_FLOOR_Y + 0.55, ZERO_G_CEILING_Y - 0.65)
    : (zeroGravity ? rand(1.9, 3.8) : 3.15);

  group.position.set(posClamped.x, startY, posClamped.z);
  scene.add(group);

  if (customY !== null){
    spawnJellyParticles(posClamped.x, startY, posClamped.z, color, 3, zeroGravity ? 0.15 : 0.65);
  }

  looseCandies.push({
    type,
    group,
    coreMesh,
    coreMat,
    haloMesh,
    haloMat,
    materials,
    color,
    floatY: (customY !== null) ? startY : rand(1.65, 3.85),
    pos: { x: posClamped.x, y: startY, z: posClamped.z },
    vel: { x: rand(-0.45, 0.45), y: zeroGravity ? rand(-0.25, 0.25) : -1.2, z: rand(-0.45, 0.45) },
    phase: Math.random() * TAU,
  });

  sfx.playPop(type === 'normal' ? 1.15 : 1.32);
  return type;
}

function updateCandies(dt, elapsed){
  for (const ax of axolotls) ax.chaseCandy = null;
  const claimed = new Set();

  for (let i = looseCandies.length - 1; i >= 0; i--){
    const cd = looseCandies[i];

    if (zeroGravity){
      const targetY = cd.floatY + Math.sin(elapsed * 1.8 + cd.phase) * 0.24;
      cd.vel.y += (targetY - cd.pos.y) * 2.8 * dt;
      const damp = Math.pow(0.95, dt * 60);
      cd.vel.x *= damp; cd.vel.y *= damp; cd.vel.z *= damp;
      cd.pos.x += cd.vel.x * dt;
      cd.pos.y = clamp(cd.pos.y + cd.vel.y * dt, TRAY_FLOOR_Y + 0.45, ZERO_G_CEILING_Y - 0.55);
      cd.pos.z += cd.vel.z * dt;
    } else {
      cd.vel.y -= GRAVITY * 0.78 * dt;
      cd.pos.x += cd.vel.x * dt;
      cd.pos.y += cd.vel.y * dt;
      cd.pos.z += cd.vel.z * dt;

      const restY = TRAY_FLOOR_Y + 0.16;
      if (cd.pos.y <= restY){
        cd.pos.y = restY;
        cd.vel.y = (-cd.vel.y > 1.2) ? (-cd.vel.y * 0.45) : 0;
        cd.vel.x *= 0.88;
        cd.vel.z *= 0.88;
      }
    }

    const cl = clampToTrayRoundedRect(cd.pos.x, cd.pos.z, 0.35);
    cd.pos.x = cl.x;
    cd.pos.z = cl.z;

    cd.group.position.set(cd.pos.x, cd.pos.y + Math.sin(elapsed * 5 + cd.phase) * 0.025, cd.pos.z);
    cd.group.rotation.y += dt * 1.9;
    if (cd.type === 'rainbow'){
      const hue = (elapsed * 0.36 + cd.phase * 0.15) % 1.0;
      cd.coreMat.color.setHSL(hue, 0.90, 0.68);
      cd.coreMat.emissive.setHSL(hue, 0.85, 0.32);
      cd.color = cd.coreMat.color.getHex();
      if (cd.haloMesh){
        cd.haloMesh.rotation.z += dt * 2.4;
        cd.haloMat.color.setHSL((hue + 0.25) % 1.0, 0.92, 0.74);
      }
    } else if (cd.type === 'fizz'){
      const pulse = 1.0 + Math.sin(elapsed * 14 + cd.phase) * 0.13;
      cd.coreMesh.scale.setScalar(pulse);
      if (cd.haloMesh) cd.haloMesh.rotation.z -= dt * 4.2;
    } else if (cd.type === 'size' && cd.haloMesh){
      cd.haloMesh.rotation.x += dt * 1.6;
      cd.haloMesh.rotation.y += dt * 2.1;
    }

    // 按 AI 优先级分配给 P4/P5/P5.5/P6 的空闲软糖（跳过抓取中、跳跳狂欢中、被撸中）
    let bestPet = null, bestDist = Infinity;
    for (const ax of axolotls){
      if (ax.isGrabbed || ax.fizzTimer > 0 || ax.rubHappyTimer > 0 || claimed.has(ax)) continue;
      const d = Math.hypot(ax.pos.x - cd.pos.x, (ax.pos.y + 0.25 * ax.sizeScale) - cd.pos.y, ax.pos.z - cd.pos.z);
      if (d < bestDist){
        bestDist = d;
        bestPet = ax;
      }
    }

    if (bestPet){
      const eatRadius = 0.96 * bestPet.sizeScale + 0.24;
      if (bestDist < eatRadius){
        bestPet.eatCandy(cd);
        spawnJellyParticles(cd.pos.x, cd.pos.y + 0.18, cd.pos.z, cd.color, 7, zeroGravity ? 0.15 : 1.0);
        disposeCandyObj(cd);
        looseCandies.splice(i, 1);
      } else {
        bestPet.chaseCandy = cd;
        claimed.add(bestPet);
      }
    }
  }
}

/* =========================================================================
   11. 多宠动态体型 3D/2D 柔弹性碰撞分离
   ========================================================================= */
function resolvePetCollisions(){
  for (let i = 0; i < axolotls.length; i++){
    const a = axolotls[i];
    for (let j = i + 1; j < axolotls.length; j++){
      const b = axolotls[j];
      const minDist = (a.colRadius + b.colRadius) * 1.02;
      const dx = b.pos.x - a.pos.x;
      const dy = (b.pos.y - a.pos.y) * (zeroGravity ? 1.0 : 0.85);
      const dz = b.pos.z - a.pos.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 >= minDist * minDist || d2 < 1e-6) continue;

      const d = Math.sqrt(d2);
      const overlap = (minDist - d) * 0.5;
      const nx = dx / d, ny = dy / d, nz = dz / d;

      const wa = a.isGrabbed ? 0.15 : (1 / Math.max(0.6, a.sizeScale));
      const wb = b.isGrabbed ? 0.15 : (1 / Math.max(0.6, b.sizeScale));
      const wSum = wa + wb || 1;
      const fa = (overlap * 2 * wa) / wSum;
      const fb = (overlap * 2 * wb) / wSum;

      a.pos.x -= nx * fa;
      a.pos.y = Math.max(a.floorRestY, a.pos.y - ny * fa * (zeroGravity ? 1.0 : 0.5));
      a.pos.z -= nz * fa;

      b.pos.x += nx * fb;
      b.pos.y = Math.max(b.floorRestY, b.pos.y + ny * fb * (zeroGravity ? 1.0 : 0.5));
      b.pos.z += nz * fb;

      const relVn = (b.vel.x - a.vel.x) * nx + (b.vel.y - a.vel.y) * ny + (b.vel.z - a.vel.z) * nz;
      if (relVn < 0){
        const fizzBoost = (a.fizzTimer > 0 || b.fizzTimer > 0) ? 1.85 : 1.0;
        const imp = -relVn * 0.44 * fizzBoost;
        if (!a.isGrabbed){
          a.vel.x -= nx * imp;
          if (zeroGravity) a.vel.y -= ny * imp;
          a.vel.z -= nz * imp;
          a.squashVel -= Math.min(imp * 0.65, 4.5);
        }
        if (!b.isGrabbed){
          b.vel.x += nx * imp;
          if (zeroGravity) b.vel.y += ny * imp;
          b.vel.z += nz * imp;
          b.squashVel -= Math.min(imp * 0.65, 4.5);
        }
        if (imp > 2.6){
          spawnJellyParticles(
            (a.pos.x + b.pos.x) * 0.5,
            (a.pos.y + b.pos.y) * 0.5 + 0.3,
            (a.pos.z + b.pos.z) * 0.5,
            a.flavor.color,
            4,
            zeroGravity ? 0.15 : 1.0
          );
        }
      }
    }
  }
}

/* =========================================================================
   12. 相机视口居中偏移 & 平滑轨道/缩放更新（失重态焦点上抬至 2.05）
   ========================================================================= */
function updateViewportLayout(){
  if (!camera) return;
  const W = window.innerWidth;
  const H = window.innerHeight;
  const paneEl = document.getElementById('pane');
  const isDesktop = W > 780;

  let paneOccupied = 0;
  if (!panelCollapsed && paneEl){
    const rect = paneEl.getBoundingClientRect();
    if (rect.width > 0 && rect.left < W){
      paneOccupied = Math.max(0, W - rect.left);
    }
  }

  rightPanelSafeMarginPx = (!panelCollapsed && isDesktop) ? (paneOccupied + 26) : (isDesktop ? 42 : 24);

  if (isDesktop && !panelCollapsed && paneOccupied > 60){
    const offsetX = Math.round(paneOccupied * 0.46);
    camera.setViewOffset(W, H, offsetX, 0, W, H);
  } else {
    camera.clearViewOffset();
  }
  camera.aspect = W / Math.max(H, 1);
  camera.updateProjectionMatrix();
}

function setTargetZoom(val){
  camState.targetZoom = clamp(val, camState.minZoom, camState.maxZoom);
  const pct = Math.round((1 / camState.targetZoom) * 100);
  const pctEl = document.getElementById('zoom-pct');
  if (pctEl) pctEl.textContent = `${pct}%`;
}

function resetCameraView(silent = false){
  camState.targetYaw = camState.defaultYaw;
  camState.targetPitch = camState.defaultPitch;
  setTargetZoom(camState.defaultZoom);
  if (!silent){
    sfx.playPop(1.08);
    showToast('已恢复默认视角与缩放');
  }
}

function updateCamera(dt){
  const damp = 1 - Math.exp(-10.5 * dt);
  camState.zoom = lerp(camState.zoom, camState.targetZoom, damp);
  camState.yaw = lerp(camState.yaw, camState.targetYaw, damp);
  camState.pitch = lerp(camState.pitch, camState.targetPitch, damp);

  // 失重态平滑上抬焦点至 2.05，完整包揽盘底至高空 5.2 的 3D 追逐全景
  const targetY = zeroGravity ? 2.05 : 0.52;
  camState.target.y = lerp(camState.target.y, targetY, clamp(dt * 4.8, 0, 1));

  const parallax = (grab || orbitDrag) ? 0 : 1;
  const mx = clamp(mouse.x, -1, 1) * parallax;
  const my = clamp(mouse.y, -1, 1) * parallax;

  const effYaw = camState.yaw - mx * 0.04;
  const effPitch = clamp(camState.pitch - my * 0.025, camState.minPitch - 0.04, camState.maxPitch + 0.04);
  const dist = camState.baseDist * camState.zoom;

  const horiz = dist * Math.cos(effPitch);
  const cx = camState.target.x + Math.sin(effYaw) * horiz;
  const cy = camState.target.y + Math.sin(effPitch) * dist;
  const cz = camState.target.z + Math.cos(effYaw) * horiz;

  camera.position.set(cx, cy, cz);
  camera.lookAt(camState.target);
}

/* =========================================================================
   13. 交互分发：抓软糖 / V3 轻抚撸宠 / 右键或空白处转视角 / 双击双模态投豆 / 缩放
   ========================================================================= */
function ndcFromClient(clientX, clientY){
  return {
    x: (clientX / Math.max(window.innerWidth, 1)) * 2 - 1,
    y: -(clientY / Math.max(window.innerHeight, 1)) * 2 + 1,
  };
}

function worldScaleAt(depth){
  return 2 * Math.tan((camera.fov * Math.PI) / 360) * depth / Math.max(window.innerHeight, 1);
}

function isUIEventTarget(target){
  return !!(target && target.closest && (
    target.closest('#pane') ||
    target.closest('#pane-toggle') ||
    target.closest('#zoom-bar')
  ));
}

function pickAxolotl(ndc){
  _raycaster.setFromCamera(_ndcVec.set(ndc.x, ndc.y), camera);
  const targets = [];
  for (const ax of axolotls){
    for (const m of ax.pickMeshes) targets.push(m);
  }
  const hits = _raycaster.intersectObjects(targets, false);
  if (hits.length > 0){
    const hit = hits[0];
    const pet = hit.object.userData.pet;
    if (pet){
      return {
        ax: pet,
        partTag: hit.object.userData.partTag || 'body',
        depth: clamp(hit.distance, 2.5, 34.0),
        point: hit.point.clone(),
      };
    }
  }

  // 动态体型兜底包围球（中心在模型躯干中段 y + 0.42 * sizeScale）
  const o = _raycaster.ray.origin;
  const d = _raycaster.ray.direction;
  let best = null, bestT = Infinity;
  for (const ax of axolotls){
    const cy = ax.pos.y + 0.42 * ax.sizeScale;
    const ocx = o.x - ax.pos.x, ocy = o.y - cy, ocz = o.z - ax.pos.z;
    const rad = 1.05 * ax.sizeScale;
    const b = ocx * d.x + ocy * d.y + ocz * d.z;
    const c = ocx * ocx + ocy * ocy + ocz * ocz - rad * rad;
    const disc = b * b - c;
    if (disc < 0) continue;
    const t = -b - Math.sqrt(disc);
    if (t > 0.5 && t < bestT){
      bestT = t;
      best = {
        ax,
        partTag: 'body',
        depth: clamp(t, 2.5, 34.0),
        point: new THREE.Vector3(o.x + d.x * t, o.y + d.y * t, o.z + d.z * t),
      };
    }
  }
  return best;
}

function computeClampedGrabTarget(clientX, clientY, depth, ax){
  const W = window.innerWidth;
  const H = window.innerHeight;
  const safeX = clamp(clientX, 34, Math.max(120, W - rightPanelSafeMarginPx));
  const safeY = clamp(clientY, 40, H - 30);

  const ndc = ndcFromClient(safeX, safeY);
  _raycaster.setFromCamera(_ndcVec.set(ndc.x, ndc.y), camera);
  const o = _raycaster.ray.origin;
  const d = _raycaster.ray.direction;

  let tx = o.x + d.x * depth;
  let ty = o.y + d.y * depth - 0.35;
  let tz = o.z + d.z * depth;

  const rad = ax ? ax.colRadius : BODY_RADIUS;
  const minY = ax ? ax.floorRestY : TRAY_FLOOR_Y;
  const maxY = zeroGravity ? (ZERO_G_CEILING_Y - 0.82 * (ax ? ax.sizeScale : 1.0)) : 7.8;

  const cl = clampToTrayRoundedRect(tx, tz, rad);
  tx = cl.x;
  tz = cl.z;
  ty = clamp(ty, minY, maxY);
  return { x: tx, y: ty, z: tz };
}

function updateCursorModeClasses(){
  const ring = document.getElementById('cursor-ring');
  const dot = document.getElementById('cursor-dot');
  ring.classList.toggle('grabbing', !!grab);
  ring.classList.toggle('orbiting', !!(orbitDrag && orbitDrag.moved));
  ring.classList.toggle('firefly', fireflyMode && !grab && !(orbitDrag && orbitDrag.moved));
  dot.classList.toggle('orbiting', !!(orbitDrag && orbitDrag.moved));
  dot.classList.toggle('firefly', fireflyMode && !grab && !(orbitDrag && orbitDrag.moved));
}

function onPointerDown(e){
  if (isUIEventTarget(e.target)){
    lastEmptyTap.t = 0;
    return;
  }

  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 2){
    lastEmptyTap.t = 0;
    releaseGrab(false);
    orbitDrag = null;
    updateCursorModeClasses();
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    pinchState = { startDist: Math.max(20, dist), startZoom: camState.targetZoom };
    return;
  }

  mouse.px = e.clientX;
  mouse.py = e.clientY;
  const ndc = ndcFromClient(e.clientX, e.clientY);
  mouse.x = ndc.x;
  mouse.y = ndc.y;
  mouse.activeAt = performance.now();

  // 右键：旋转视角
  if (e.button === 2){
    lastEmptyTap.t = 0;
    releaseGrab(false);
    orbitDrag = {
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      lastX: e.clientX,
      lastY: e.clientY,
      moved: true,
      isLeftEmpty: false,
    };
    updateCursorModeClasses();
    return;
  }

  if (e.button !== 0) return;

  // 左键：优先检测软糖抓取（哪怕开着萤火逗宠也能随时抓起）
  const picked = pickAxolotl(ndc);
  if (picked){
    lastEmptyTap.t = 0;
    const ax = picked.ax;
    grab = {
      ax,
      depth: picked.depth,
      lastClientX: e.clientX,
      lastClientY: e.clientY,
      lastT: performance.now(),
      vx: 0,
      vy: 0,
      vz: 0,
      pressVel: 0,
      pointerId: e.pointerId,
    };
    ax.isGrabbed = true;
    ax.chaseCandy = null;
    ax.rubEnergy = 0;
    ax.pullBiasZ = picked.partTag === 'head' ? 1 : (picked.partTag === 'tail' ? -1 : 0);
    ax.squashVel += 3.2;
    lastRubAx = null;
    updateCursorModeClasses();
    sfx.playPop(1.05);
    return;
  }

  // 左键点在空白处：设 6px 死区防抖，超 6px 才转视角，否则双击投糖豆
  orbitDrag = {
    pointerId: e.pointerId,
    startX: e.clientX,
    startY: e.clientY,
    lastX: e.clientX,
    lastY: e.clientY,
    moved: false,
    isLeftEmpty: true,
  };
  updateCursorModeClasses();
}

function onPointerMove(e){
  if (activePointers.has(e.pointerId)){
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  if (pinchState && activePointers.size === 2){
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    const ratio = pinchState.startDist / Math.max(20, dist);
    setTargetZoom(pinchState.startZoom * ratio);
    return;
  }

  mouse.px = e.clientX;
  mouse.py = e.clientY;
  const ndc = ndcFromClient(e.clientX, e.clientY);
  mouse.x = ndc.x;
  mouse.y = ndc.y;
  mouse.activeAt = performance.now();

  pointerOverUI = !grab && !orbitDrag && isUIEventTarget(e.target);

  if (orbitDrag && e.pointerId === orbitDrag.pointerId){
    if (!orbitDrag.moved){
      if (Math.hypot(e.clientX - orbitDrag.startX, e.clientY - orbitDrag.startY) <= 8){
        return;
      }
      orbitDrag.moved = true;
      orbitDrag.lastX = e.clientX;
      orbitDrag.lastY = e.clientY;
      updateCursorModeClasses();
      return;
    }
    const dx = safeNum(e.clientX - orbitDrag.lastX, 0);
    const dy = safeNum(e.clientY - orbitDrag.lastY, 0);
    camState.targetYaw -= dx * 0.0068;
    camState.targetPitch = clamp(camState.targetPitch + dy * 0.0056, camState.minPitch, camState.maxPitch);
    orbitDrag.lastX = e.clientX;
    orbitDrag.lastY = e.clientY;
    return;
  }

  if (grab && e.pointerId === grab.pointerId){
    const now = performance.now();
    const dt = Math.max((now - grab.lastT) / 1000, 0.008);
    const ws = worldScaleAt(grab.depth);

    const dxPx = safeNum(e.clientX - grab.lastClientX, 0);
    const dyPx = safeNum(e.clientY - grab.lastClientY, 0);

    const rightX = Math.cos(camState.yaw);
    const rightZ = -Math.sin(camState.yaw);
    const screenSpdX = clamp((dxPx * ws) / dt, -28, 28);
    const screenSpdY = clamp((-dyPx * ws) / dt, -24, 24);

    grab.vx = safeNum(grab.vx * 0.65 + (screenSpdX * rightX) * 0.35, 0);
    grab.vz = safeNum(grab.vz * 0.65 + (screenSpdX * rightZ) * 0.35, 0);
    grab.vy = safeNum(grab.vy * 0.65 + screenSpdY * 0.35, 0);

    const downSpeed = clamp((dyPx * ws) / dt, 0, 26);
    grab.pressVel = Math.max(grab.pressVel * 0.82, downSpeed);
    grab.ax.squishAmt = clamp(grab.pressVel * 0.24, 0, 2.8);

    grab.lastClientX = e.clientX;
    grab.lastClientY = e.clientY;
    grab.lastT = now;
    return;
  }

  // 非拖拽态：检测悬停与 V3「轻抚撸一撸」（与萤火逗宠严格互斥）
  if (!pointerOverUI){
    const picked = pickAxolotl(ndc);
    hoverAx = picked ? picked.ax : null;

    if (!fireflyMode && hoverAx && hoverAx.rubCooldown <= 0 && !hoverAx.isGrabbed){
      if (lastRubAx === hoverAx){
        const stepDist = Math.hypot(e.clientX - lastRubClientX, e.clientY - lastRubClientY);
        if (stepDist > 1 && stepDist < 120){
          hoverAx.rubEnergy += stepDist;
          if (hoverAx.rubEnergy >= 180){
            hoverAx.triggerRubHappy();
          }
        }
      } else {
        if (lastRubAx) lastRubAx.rubEnergy = 0;
        lastRubAx = hoverAx;
      }
      lastRubClientX = e.clientX;
      lastRubClientY = e.clientY;
    } else {
      if (lastRubAx) lastRubAx.rubEnergy = 0;
      lastRubAx = null;
    }
  } else {
    hoverAx = null;
    if (lastRubAx) lastRubAx.rubEnergy = 0;
    lastRubAx = null;
  }
}

function releaseGrab(applyFling = true){
  if (!grab) return;
  const ax = grab.ax;

  if (applyFling){
    const flingScale = zeroGravity ? 0.42 : 0.72;
    const flingX = clamp(safeNum(grab.vx, 0) * flingScale, -18, 18);
    const flingZ = clamp(safeNum(grab.vz, 0) * flingScale, -18, 18);
    const flingY = clamp(safeNum(grab.vy, 0) * (zeroGravity ? 0.38 : 0.68), -12, 16);
    const pressBounce = zeroGravity ? 0 : clamp(safeNum(grab.pressVel, 0) * 0.26, 0, 5.5);

    ax.vel.x = clamp(ax.vel.x * 0.35 + flingX, -20, 20);
    ax.vel.z = clamp(ax.vel.z * 0.35 + flingZ, -20, 20);
    ax.vel.y = clamp(Math.max(ax.vel.y * 0.35 + flingY, pressBounce), -12, 18);
    if (zeroGravity){
      ax.floatY = clamp(ax.pos.y, TRAY_FLOOR_Y + 0.35, ZERO_G_CEILING_Y - 0.95 * ax.sizeScale);
    }

    const stretchMag = ax.pullVec.length();
    ax.squashVel += 4.2 + stretchMag * 5.0 + pressBounce * 1.1;
    if (pressBounce > 2.0 || stretchMag > 0.45){
      spawnJellyParticles(ax.pos.x, ax.pos.y + 0.3, ax.pos.z, ax.flavor.color, 5, zeroGravity ? 0.15 : 1.0);
    }
    sfx.playBoing(0.95 + stretchMag * 0.35, 0.13, ax.sizeScale);
  }

  ax.isGrabbed = false;
  ax.squishAmt = 0;
  ax.pullBiasZ = 0;
  grab = null;
  updateCursorModeClasses();
}

function handleDoubleClickDropCandy(clientX, clientY){
  const ndc = ndcFromClient(clientX, clientY);
  _raycaster.setFromCamera(_ndcVec.set(ndc.x, ndc.y), camera);

  // 失重模式：直接对垂直相机视线、过太空舱中心 (0, 2.75, 0) 的 3D 平面求交，在任意立体位置悬浮投豆
  if (zeroGravity){
    camera.getWorldDirection(_camDir);
    _planeFirefly3D.setFromNormalAndCoplanarPoint(_camDir, _zeroGCenter);
    const airHit = _raycaster.ray.intersectPlane(_planeFirefly3D, _hitPt);
    if (airHit){
      const actualType = spawnLooseCandy(airHit.x, airHit.z, selectedCandyMode, airHit.y);
      showCandySpawnToast(actualType);
    }
    return;
  }

  // 地面模式 1：命中盘面及盘沿周边（1.35 倍范围），收敛进盘并从上方 3.15 落下
  const trayHit = _raycaster.ray.intersectPlane(_planeTray, _hitPt);
  if (trayHit && Math.abs(trayHit.x) <= TRAY_HALF_X * 1.35 && Math.abs(trayHit.z) <= TRAY_HALF_Z * 1.35){
    const actualType = spawnLooseCandy(trayHit.x, trayHit.z, selectedCandyMode, null);
    showCandySpawnToast(actualType);
    return;
  }

  // 地面模式 2：在瓷盘上方半空双击时，回退对垂直相机视线、过盘心上方 (0, 1.85, 0) 的 3D 平面求交，从半空坠入瓷盘
  camera.getWorldDirection(_camDir);
  _v1.set(0, 1.85, 0);
  _planeFirefly3D.setFromNormalAndCoplanarPoint(_camDir, _v1);
  const midAirHit = _raycaster.ray.intersectPlane(_planeFirefly3D, _hitPt);
  if (midAirHit){
    const dropY = clamp(midAirHit.y, 1.65, 4.6);
    const actualType = spawnLooseCandy(midAirHit.x, midAirHit.z, selectedCandyMode, dropY);
    showCandySpawnToast(actualType);
  }
}

function onPointerUp(e){
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinchState = null;

  if (orbitDrag && e.pointerId === orbitDrag.pointerId){
    const wasEmptyTap = orbitDrag.isLeftEmpty && !orbitDrag.moved;
    orbitDrag = null;
    updateCursorModeClasses();

    if (wasEmptyTap && !isUIEventTarget(e.target)){
      const now = performance.now();
      const dtTap = now - lastEmptyTap.t;
      const distTap = Math.hypot(e.clientX - lastEmptyTap.x, e.clientY - lastEmptyTap.y);
      if (dtTap < 380 && distTap < 38){
        handleDoubleClickDropCandy(e.clientX, e.clientY);
        lastEmptyTap.t = 0;
      } else {
        lastEmptyTap = { t: now, x: e.clientX, y: e.clientY };
      }
    }
    return;
  }

  if (grab && e.pointerId === grab.pointerId){
    releaseGrab(true);
  }
}

function onPointerCancel(e){
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinchState = null;
  lastEmptyTap.t = 0;
  orbitDrag = null;
  releaseGrab(false);
  updateCursorModeClasses();
}

function onWheel(e){
  if (isUIEventTarget(e.target)) return;
  e.preventDefault();
  const delta = clamp(e.deltaY, -160, 160);
  const factor = Math.exp(delta * 0.0012);
  setTargetZoom(camState.targetZoom * factor);
}

/* =========================================================================
   14. 软糖管理、五声音乐盒 UI 联动与全盘交互绑定
   ========================================================================= */
const $ = id => document.getElementById(id);

let toastTimer = null;
function showToast(msg){
  const el = $('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}

function showCandySpawnToast(type){
  if (type === 'rainbow') showToast('投喂了 🌈 彩虹变色糖，看谁先游过去变色！');
  else if (type === 'fizz') showToast('投喂了 ⚡ 跳跳气泡糖，准备迎接狂欢！');
  else if (type === 'size') showToast('投喂了 ⭐ 奇趣变身糖，会变大还是变小？');
  else showToast('糖豆落盘啦！看谁先游过去吃掉 🍬');
}

function updateCountChip(){
  $('ax-count').textContent = `托盘现有 ${axolotls.length} 只软糖`;
  const btn = $('dump');
  const full = axolotls.length >= MAX_AX;
  btn.classList.toggle('is-full', full);
  btn.innerHTML = full
    ? '托盘已满（10 只）'
    : '再倒出几只六角恐龙<span class="arr">↓</span>';
}

function updateMusicBarUI(){
  const bar = $('music-bar');
  const playBtn = $('btn-music-play');
  const titleEl = $('music-title');
  if (bar) bar.classList.toggle('playing', musicBox.playing);
  if (playBtn){
    playBtn.textContent = musicBox.playing ? '⏸' : '🎵';
    playBtn.classList.toggle('play-active', musicBox.playing);
  }
  if (titleEl){
    titleEl.textContent = musicBox.currentSong.title;
  }
}

function spawnAxolotl(flavor, x, z, yaw, y, dropVel){
  const cl = clampToTrayRoundedRect(x, z, BODY_RADIUS + 0.15);
  const startY = zeroGravity ? rand(1.5, 3.8) : y;
  const pet = new JellyAxolotlPet(flavor, cl.x, cl.z, yaw, startY, zeroGravity ? 0 : dropVel);
  axolotls.push(pet);
  updateCountChip();
  return pet;
}

function resetDesktopPets(silent = false){
  // 重置桌面时严格保留音乐盒播放状态、失重开关与萤火开关不中断
  releaseGrab(false);
  lastRubAx = null;
  while (axolotls.length > 0){
    axolotls.pop().dispose();
  }
  while (looseCandies.length > 0){
    disposeCandyObj(looseCandies.pop());
  }

  const startXs = [-2.55, -1.28, 0.0, 1.28, 2.55];
  const startZs = [0.55, -0.82, 0.22, -0.88, 0.48];
  for (let i = 0; i < 5; i++){
    const yaw = (i - 2) * -0.22 + rand(-0.18, 0.18);
    spawnAxolotl(FLAVORS[i], startXs[i], startZs[i], yaw, 1.4 + i * 0.28, 0.4);
  }
  updateCountChip();
  if (!silent){
    sfx.playPop(1.12);
    showToast('已整理好初始五味软糖（音乐盒与模式状态保持不变）🍬');
  }
}

function setPanelCollapsed(collapsed){
  panelCollapsed = collapsed;
  $('pane').classList.toggle('collapsed', collapsed);
  $('pane-toggle').classList.toggle('visible', collapsed);
  updateViewportLayout();
  if (collapsed){
    showToast('已收起图鉴，解锁全屏手作瓷盘 ✨');
  }
}

function toggleFireflyMode(){
  fireflyMode = !fireflyMode;
  const btn = $('btn-firefly');
  btn.classList.toggle('active', fireflyMode);
  btn.classList.toggle('firefly-on', fireflyMode);

  if (fireflyMode){
    axolotls.forEach(ax => { ax.rubEnergy = 0; });
    lastRubAx = null;
    sfx.playChime(659.25, 1.0, 0.10);
    showToast(zeroGravity
      ? '✨ 3D 失重追光已开启！移动鼠标上下左右控制光球，右键转视角抵达任意深度'
      : '✨ 萤火逗宠已开启！晃动鼠标吸引大家围观');
  } else {
    sfx.playPop(0.95);
    showToast('已收起萤火逗宠棒（轻抚软糖背部可触发撸宠）');
  }
  updateCursorModeClasses();
}

function toggleZeroGravity(){
  zeroGravity = !zeroGravity;
  const btn = $('btn-zerog');
  btn.classList.toggle('active', zeroGravity);
  btn.classList.toggle('zero-g-on', zeroGravity);

  if (zeroGravity){
    axolotls.forEach((ax, idx) => {
      ax.floatY = rand(1.45, ZERO_G_CEILING_Y - 1.25 * ax.sizeScale);
      ax.vel.y = rand(1.5, 2.9);
      ax.vel.x += rand(-0.9, 0.9);
      ax.vel.z += rand(-0.9, 0.9);
      ax.yawVel = rand(-1.4, 1.4);
      ax.onFloor = false;
      setTimeout(() => sfx.playChime(ax.flavor.freq, ax.sizeScale, 0.075), idx * 55);
    });
    looseCandies.forEach(cd => {
      cd.floatY = rand(1.55, 3.85);
      cd.vel.y = rand(0.9, 1.8);
    });
    showToast(fireflyMode
      ? '🫧 太空舱已开启！配合 ✨ 萤火可进行真 3D 全向追光'
      : '🫧 已开启太空失重模式！软糖们飘起来啦');
  } else {
    axolotls.forEach(ax => {
      ax.vel.y = Math.min(ax.vel.y, -1.2);
    });
    sfx.playPop(0.88);
    showToast('重力恢复！全盘软糖 Q 弹砸回瓷盘 🍮');
  }
}

function wireUI(){
  // 1. 生成 V3 五果味卡片（绑定 data-flavor-idx 与琴键脉冲亮灯）
  const cards = $('cards');
  for (const f of FLAVORS){
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.flavorIdx = String(f.idx);
    el.style.setProperty('--fc', f.uiHex);
    const cHex = f.color.toString(16).padStart(6, '0');
    const dHex = f.deep.toString(16).padStart(6, '0');
    el.innerHTML =
      `<div class="swatch" style="background:radial-gradient(circle at 32% 30%, #fff 0%, transparent 46%), linear-gradient(135deg, #${cHex}, #${dHex})"></div>` +
      `<div><div class="name">${f.name}</div><div class="note">${f.note}</div></div>` +
      `<div class="tag">点它跳跳</div>`;
    el.addEventListener('click', () => {
      pulseFlavorCardUI(f.idx);
      const matched = axolotls.filter(a => a.flavor.id === f.id);
      if (matched.length > 0){
        matched.forEach(a => a.triggerHop(1.0));
        sfx.playChime(f.freq, matched[0].sizeScale, 0.13);
        showToast(`${f.name}软糖开心得蹦起来啦 🍬`);
      } else if (axolotls.length < MAX_AX){
        const spawned = spawnAxolotl(f, rand(-2.0, 2.0), rand(-1.1, 1.1), rand(-0.5, 0.5), 4.6, 1.5);
        if (spawned) spawned.triggerHop(0.85);
        sfx.playChime(f.freq, 1.0, 0.12);
        showToast(`新倒出一只「${f.name}」软糖 🍬`);
      } else {
        trayGoldPulse = 1.0;
        sfx.playChime(f.freq, 1.0, 0.11);
        showToast(`盘里目前没有${f.name}口味（可喂 🌈 变色糖试试）`);
      }
    });
    cards.appendChild(el);
  }

  // 2. 生成五声音乐盒 5 枚迷你指示灯
  const ledsWrap = $('music-leds');
  for (const f of FLAVORS){
    const led = document.createElement('span');
    led.className = 'music-led';
    led.dataset.ledId = String(f.idx);
    led.style.setProperty('--lc', f.uiHex);
    ledsWrap.appendChild(led);
  }

  // 3. 五声音乐盒播放 / 暂停 & 切歌按钮
  $('btn-music-play').addEventListener('click', () => {
    const isPlaying = musicBox.toggle();
    updateMusicBarUI();
    const song = musicBox.currentSong;
    showToast(isPlaying ? `🎵 开始演奏 ${song.title}（${song.style}）` : '⏸ 已暂停五声果冻小乐团');
  });

  $('btn-music-next').addEventListener('click', () => {
    sfx.init();
    const song = musicBox.nextSong();
    updateMusicBarUI();
    showToast(`⏭ 切歌：${song.title} · ${song.style}`);
  });

  // 4. Q 弹晃动度滑块
  const wSlider = $('wobble');
  wSlider.addEventListener('input', () => {
    wobble = (+wSlider.value) / 50;
    $('wobble-val').textContent = wSlider.value;
  });

  // 5. 魔法糖豆单选胶囊
  document.querySelectorAll('.candy-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      selectedCandyMode = pill.dataset.candy;
      document.querySelectorAll('.candy-pill').forEach(b => b.classList.toggle('active', b === pill));
      sfx.playPop(1.15);
    });
  });

  // 6. 投喂按钮
  $('btn-feed').addEventListener('click', () => {
    const actualType = spawnLooseCandy(rand(-2.5, 2.5), rand(-1.5, 1.5), selectedCandyMode);
    showCandySpawnToast(actualType);
  });

  // 7. 2×2 玩法按钮
  $('btn-firefly').addEventListener('click', toggleFireflyMode);
  $('btn-zerog').addEventListener('click', toggleZeroGravity);

  $('btn-shake').addEventListener('click', () => {
    if (zeroGravity){
      axolotls.forEach((ax, idx) => {
        const ang = Math.atan2(ax.pos.z, ax.pos.x) + Math.PI * 0.5;
        ax.vel.x += Math.cos(ang) * 3.4 + rand(-0.9, 0.9);
        ax.vel.z += Math.sin(ang) * 3.4 + rand(-0.9, 0.9);
        ax.vel.y += rand(-1.4, 1.8);
        ax.yawVel += rand(-3.5, 3.5);
        ax.squashVel += rand(4.5, 7.0);
        ax.happyTimer = 1.0;
        setTimeout(() => sfx.playChime(ax.flavor.freq, ax.sizeScale, 0.08), idx * 55);
      });
      showToast('🫧 释放了一阵失重柔风漩涡！');
    } else {
      axolotls.forEach((ax, idx) => {
        ax.vel.y = Math.max(ax.vel.y, rand(4.6, 7.2));
        ax.vel.x += rand(-3.4, 3.4);
        ax.vel.z += rand(-2.6, 2.6);
        ax.squashVel += rand(6.0, 9.5);
        ax.happyTimer = 1.0;
        ax.onFloor = false;
        setTimeout(() => sfx.playChime(ax.flavor.freq, ax.sizeScale, 0.085), idx * 50);
      });
      showToast('整盘软糖奏响五声音阶弹起来啦 🍮');
    }
  });

  $('btn-reset').addEventListener('click', () => resetDesktopPets(false));

  // 8. 再倒出几只
  $('dump').addEventListener('click', () => {
    if (axolotls.length >= MAX_AX){
      const btn = $('dump');
      btn.style.transform = 'translateX(-4px)';
      setTimeout(() => (btn.style.transform = ''), 90);
      showToast('瓷盘上已经放满 10 只软糖啦');
      return;
    }
    const n = Math.min(3, MAX_AX - axolotls.length);
    for (let i = 0; i < n; i++){
      const flavor = FLAVORS[(Math.random() * FLAVORS.length) | 0];
      spawnAxolotl(flavor, rand(-2.6, 2.6), rand(-1.5, 1.5), rand(-0.8, 0.8), rand(4.5, 6.8), 1.6);
    }
    sfx.playPop(1.2);
  });

  // 9. 左下角缩放与视角复位胶囊
  $('btn-zoom-in').addEventListener('click', () => setTargetZoom(camState.targetZoom * 0.84));
  $('btn-zoom-out').addEventListener('click', () => setTargetZoom(camState.targetZoom * 1.18));
  $('btn-view-reset').addEventListener('click', () => resetCameraView(false));

  // 10. 面板收起/展开 & 静音开关
  $('btn-collapse').addEventListener('click', () => setPanelCollapsed(true));
  $('pane-toggle').addEventListener('click', () => setPanelCollapsed(false));

  const soundBtn = $('btn-sound');
  soundBtn.addEventListener('click', () => {
    sfx.setEnabled(!sfx.enabled);
    soundBtn.textContent = sfx.enabled ? '🔊' : '🔇';
    if (sfx.enabled) sfx.playChime(523.25, 1.0, 0.10);
  });

  setInterval(() => {
    $('stretch').textContent = Math.round(clamp(stretchMeter, 0, 180));
    $('bounce').textContent = clamp(bounceMeter, 0, 9.9).toFixed(1);
  }, 110);

  window.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerCancel);
  window.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('contextmenu', e => {
    if (!isUIEventTarget(e.target)) e.preventDefault();
  });
  window.addEventListener('blur', () => {
    activePointers.clear();
    pinchState = null;
    lastEmptyTap.t = 0;
    orbitDrag = null;
    lastRubAx = null;
    releaseGrab(false);
    updateCursorModeClasses();
  });
  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    updateViewportLayout();
  });

  if (window.innerWidth <= 780){
    setPanelCollapsed(true);
  }
}

/* =========================================================================
   15. 自定义软糖光标平滑跟随
   ========================================================================= */
let curX = mouse.px, curY = mouse.py, curS = 1;
function updateCursor(dt){
  curX = lerp(curX, mouse.px, 1 - Math.pow(0.0001, dt));
  curY = lerp(curY, mouse.py, 1 - Math.pow(0.0001, dt));
  const ring = $('cursor-ring');
  const dot = $('cursor-dot');

  const hideCustom = pointerOverUI;
  ring.classList.toggle('hidden', hideCustom);
  dot.classList.toggle('hidden', hideCustom);

  const isOrbiting = !!(orbitDrag && orbitDrag.moved);
  const targetS = grab ? 1.82 : (isOrbiting ? 1.48 : (fireflyMode ? 1.25 : (hoverAx ? 1.32 : 1.0)));
  curS = lerp(curS, targetS, 1 - Math.pow(0.01, dt));
  ring.style.transform = `translate(${curX}px, ${curY}px) translate(-50%, -50%) scale(${curS.toFixed(3)})`;
  dot.style.transform = `translate(${mouse.px}px, ${mouse.py}px) translate(-50%, -50%)`;
}

/* =========================================================================
   16. 主循环与场景初始化
   ========================================================================= */
function tick(now){
  requestAnimationFrame(tick);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!Number.isFinite(dt) || dt <= 0) dt = 1 / 60;
  if (dt > 0.05) dt = 0.05;

  time += dt;
  acc += dt;

  // 在主渲染帧 dt 推进五声音乐盒节拍，确保高刷/低刷屏节奏精准不抖动
  musicBox.update(dt);
  updateFirefly(dt, time);

  let steps = 0;
  while (acc >= H_STEP && steps < 3){
    const gtarget = grab ? computeClampedGrabTarget(mouse.px, mouse.py, grab.depth, grab.ax) : null;
    for (const ax of axolotls){
      ax.stepPhysics(H_STEP, time, (grab && grab.ax === ax) ? gtarget : null);
    }
    resolvePetCollisions();
    updateCandies(H_STEP, time);
    acc -= H_STEP;
    steps++;
  }
  if (steps === 3) acc = 0;

  let maxStrain = 0;
  let maxBounce = 0;
  for (const ax of axolotls){
    ax.stepRenderTimers(dt);
    ax.updateVisuals(dt, time, musicBox.beatPhase);
    if (ax.currentStrain > maxStrain) maxStrain = ax.currentStrain;
    const speedMetric = Math.hypot(ax.vel.x, ax.vel.y, ax.vel.z) * 0.18 + Math.abs(ax.squashVel) * 0.22;
    if (speedMetric > maxBounce) maxBounce = speedMetric;
  }

  updateParticles(dt);
  updateHearts(dt, time);
  updateNotes(dt);

  // 缺味兜底：香槟金瓷盘描边暖金微闪衰减
  if (trayGoldPulse > 0 && trayGoldMat){
    trayGoldPulse = Math.max(0, trayGoldPulse - dt / 0.36);
    trayGoldMat.emissiveIntensity = Math.sin(trayGoldPulse * Math.PI) * 0.78;
  }

  stretchMeter = lerp(stretchMeter, maxStrain * 100, 0.22);
  bounceMeter = Math.max(bounceMeter * 0.93, maxBounce);

  updateCamera(dt);
  updateCursor(dt);
  renderer.render(scene, camera);
}

function init(){
  _raycaster = new THREE.Raycaster();
  _ndcVec = new THREE.Vector2();
  _v1 = new THREE.Vector3();
  _upVec = new THREE.Vector3(0, 1, 0);
  _qPull = new THREE.Quaternion();
  _qInv = new THREE.Quaternion();
  _planeTray = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TRAY_FLOOR_Y);
  _planeFirefly = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.95);
  _planeFirefly3D = new THREE.Plane();
  _zeroGCenter = new THREE.Vector3(0, 2.75, 0);
  _camDir = new THREE.Vector3();
  _hitPt = new THREE.Vector3();
  camState.target = new THREE.Vector3(0, 0.52, 0);

  const canvas = document.getElementById('stage');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0xf1e8dd, 1);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf1e8dd);
  scene.fog = new THREE.Fog(0xf1e8dd, 22, 48);

  camera = new THREE.PerspectiveCamera(37, window.innerWidth / Math.max(window.innerHeight, 1), 0.1, 120);

  // 柔和工作室环境光贴图（用完及时销毁临时几何与材质）
  const pmrem = new THREE.PMREMGenerator(renderer);
  {
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0xfff7ee);
    const disposables = [];
    const addPanel = (color, w, h, x, y, z) => {
      const geo = new THREE.PlaneGeometry(w, h);
      const mat = new THREE.MeshBasicMaterial({ color });
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.lookAt(0, 1.2, 0);
      envScene.add(m);
      disposables.push(geo, mat);
    };
    addPanel(0xffffff, 16, 12, 0, 14, 4);
    addPanel(0xffe4cc, 12, 9, -14, 6, 4);
    addPanel(0xdff2ff, 12, 9, 14, 6, -5);
    scene.environment = pmrem.fromScene(envScene, 0.035).texture;
    disposables.forEach(d => d.dispose());
    pmrem.dispose();
  }

  const hemi = new THREE.HemisphereLight(0xfffcf7, 0xdccbb8, 0.92);
  scene.add(hemi);

  const keyLight = new THREE.DirectionalLight(0xfff6ea, 1.38);
  keyLight.position.set(6.2, 13.2, 7.2);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 2;
  keyLight.shadow.camera.far = 30;
  keyLight.shadow.camera.left = -8.5;
  keyLight.shadow.camera.right = 8.5;
  keyLight.shadow.camera.top = 8.5;
  keyLight.shadow.camera.bottom = -8.5;
  keyLight.shadow.bias = -0.0005;
  keyLight.shadow.normalBias = 0.018;
  keyLight.shadow.radius = 3.2;
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0xd9efff, 0.62);
  rimLight.position.set(-7.5, 6.5, -7.0);
  scene.add(rimLight);

  const fillLight = new THREE.DirectionalLight(0xfff0df, 0.36);
  fillLight.position.set(2, 4, 10);
  scene.add(fillLight);

  buildAtelierStage();

  glowTex = createSoftGlowTexture();
  noteTex = createNoteTexture();
  sharedGeos = buildSharedGeometries();

  initParticlePool(52);
  initHeartPool(20);
  initNotePool(18);
  initFirefly();

  wireUI();
  updateMusicBarUI();
  updateViewportLayout();
  resetDesktopPets(true);
  updateCamera(1);
  renderer.render(scene, camera);

  lastT = performance.now();
  window.__gummyBooted = true;
  requestAnimationFrame(tick);
}

      showOffline({ message: err && err.message ? err.message : 'Three.js 加载异常' });
