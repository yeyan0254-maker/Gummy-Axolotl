<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>软糖六角恐龙 · Q弹果冻小宠 V5.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍬</text></svg>">
<style>
  :root{
    --ink: #241e26;
    --ink-soft: #6d6472;
    --ink-faint: #a39aa9;
    --pink: #f288ab;
    --pink-deep: #e8618d;
    --gold: #cfa96e;
    --glass-bg: rgba(255, 253, 250, 0.84);
    --glass-border: rgba(36, 30, 38, 0.08);
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  }

  *{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html, body{
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body{
    background: #f1e8dd;
    color: var(--ink);
    font-family: var(--sans);
    cursor: none;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  @media (hover: none){
    body{ cursor: auto; }
    #cursor-ring, #cursor-dot{ display: none !important; }
  }

  #stage{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none;
  }

  /* Left Title Block (V3 保留) */
  #title-block{
    position: fixed;
    top: 28px;
    left: 36px;
    z-index: 10;
    pointer-events: none;
    user-select: none;
    max-width: 440px;
  }
  .kicker{
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.24em;
    color: var(--ink-faint);
    margin-bottom: 9px;
  }
  h1.title{
    font-family: var(--serif);
    font-style: normal;
    font-weight: 600;
    font-size: clamp(32px, 3.9vw, 54px);
    line-height: 1.08;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  h1.title .slash{
    color: var(--pink-deep);
    font-weight: 400;
    padding: 0 0.08em;
  }
  .subtitle{
    margin-top: 10px;
    font-family: var(--serif);
    font-style: normal;
    font-size: clamp(13px, 1.05vw, 15px);
    color: var(--ink-soft);
    max-width: 390px;
    line-height: 1.68;
  }
  .hint{
    margin-top: 12px;
    font-family: var(--sans);
    font-size: 11.5px;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .hint::before{
    content: "";
    display: inline-block;
    width: 14px;
    height: 1px;
    background: var(--ink-faint);
  }

  /* Bottom-Left Zoom & View Capsule (V3 保留) */
  #zoom-bar{
    position: fixed;
    left: 34px;
    bottom: 24px;
    z-index: 25;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 7px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 24px rgba(36, 30, 38, 0.075);
    cursor: auto;
  }
  .z-btn{
    height: 28px;
    min-width: 28px;
    padding: 0 8px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.16s ease, color 0.16s ease, transform 0.12s ease;
  }
  .z-btn:hover{
    background: rgba(36, 30, 38, 0.06);
    color: var(--ink);
  }
  .z-btn:active{
    transform: scale(0.93);
  }
  .z-btn.reset-view{
    font-size: 11.5px;
    font-weight: 500;
    padding: 0 10px;
    border-left: 1px solid rgba(36, 30, 38, 0.09);
    border-radius: 0 999px 999px 0;
    margin-left: 2px;
  }
  #zoom-pct{
    min-width: 44px;
    text-align: center;
    font-size: 11.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    user-select: none;
  }

  /* Floating Toggle Button (when panel collapsed) */
  #pane-toggle{
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 30;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 24px rgba(36, 30, 38, 0.09);
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.25s ease, box-shadow 0.2s ease;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
  }
  #pane-toggle.visible{
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  #pane-toggle:hover{
    box-shadow: 0 12px 28px rgba(36, 30, 38, 0.13);
    transform: translateY(-1px);
  }

  /* Right Control Panel (V3 保留) */
  #pane{
    position: fixed;
    top: 18px;
    right: 20px;
    bottom: 18px;
    z-index: 20;
    width: 304px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 2px 6px 12px 2px;
    scrollbar-width: thin;
    scrollbar-color: #f0dde5 transparent;
    cursor: auto;
    transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
  }
  #pane.collapsed{
    transform: translateX(calc(100% + 36px));
    opacity: 0;
    pointer-events: none;
  }

  .panel-head{
    padding: 5px 8px 10px 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
  }
  .panel-head h2{
    font-family: var(--serif);
    font-style: normal;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  .panel-head .cap{
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    margin-top: 3px;
  }
  .head-actions{
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .mini-btn{
    height: 28px;
    padding: 0 9px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.88);
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 11.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .mini-btn:hover{
    background: #fff;
    color: var(--ink);
    box-shadow: 0 4px 10px rgba(36, 30, 38, 0.08);
  }
  .mini-btn.icon-only{
    width: 28px;
    padding: 0;
    font-size: 13px;
  }

  /* Flavor Cards (V3 保留 + 音乐琴键发光脉冲 .singing) */
  .card{
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 18px rgba(36, 30, 38, 0.042);
    padding: 7.5px 11px;
    margin: 0 2px 6.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.16s ease, box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
  }
  .card:hover{
    transform: translateY(-1.5px);
    box-shadow: 0 10px 22px rgba(36, 30, 38, 0.08);
    border-color: rgba(232, 97, 141, 0.30);
  }
  .card:active{
    transform: scale(0.985);
  }
  .card.singing{
    border-color: var(--fc, #f288ab);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--fc, #f288ab) 25%, transparent),
                0 8px 20px color-mix(in srgb, var(--fc, #f288ab) 28%, transparent);
    transform: scale(1.015);
  }
  .swatch{
    width: 29px;
    height: 29px;
    border-radius: 50%;
    flex: 0 0 29px;
    box-shadow:
      inset 0 -4px 8px rgba(255, 255, 255, 0.5),
      inset 0 3px 6px rgba(255, 255, 255, 0.85),
      inset 0 -6px 12px rgba(0, 0, 0, 0.12),
      0 3px 8px rgba(0, 0, 0, 0.09);
  }
  .card .name{
    font-family: var(--serif);
    font-style: normal;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.2;
    color: var(--ink);
  }
  .card .note{
    font-family: var(--sans);
    font-size: 10.5px;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .card .tag{
    font-size: 10px;
    color: var(--ink-faint);
    margin-left: auto;
    padding: 2px 7px;
    border-radius: 99px;
    background: rgba(36, 30, 38, 0.045);
    white-space: nowrap;
  }

  /* Control Box (V3 保留) */
  .ctrl{
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 18px rgba(36, 30, 38, 0.042);
    padding: 10px 13px;
    margin: 0 2px 7.5px;
  }
  .row-label{
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .row-label b{
    color: var(--pink-deep);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
  }

  input[type=range]{
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 19px;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height: 5px;
    border-radius: 99px;
    background: linear-gradient(90deg, #ffd3e1, #efa6c0);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    margin-top: -5.5px;
    background: #fff;
    border: 2px solid var(--pink-deep);
    box-shadow: 0 3px 8px rgba(232, 97, 141, 0.35);
    transition: transform 0.14s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{
    transform: scale(1.12);
  }
  input[type=range]::-moz-range-track{
    height: 5px;
    border-radius: 99px;
    background: #efa6c0;
  }
  input[type=range]::-moz-range-thumb{
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--pink-deep);
    box-shadow: 0 3px 8px rgba(232, 97, 141, 0.35);
  }

  .readouts{
    display: flex;
    gap: 8px;
    margin-top: 3px;
  }
  .readout{
    flex: 1;
    background: rgba(255, 255, 255, 0.86);
    border: 1px solid rgba(36, 30, 38, 0.06);
    border-radius: 11px;
    padding: 6px 6px;
    text-align: center;
  }
  .readout .num{
    font-family: var(--serif);
    font-style: normal;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.05;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .readout .num small{
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-left: 1px;
  }
  .readout .lab{
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  /* Magic Candy Feed Section (V3 保留) */
  .feed-box{
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 18px rgba(36, 30, 38, 0.042);
    padding: 8.5px;
    margin: 0 2px 7.5px;
  }
  .feed-main-btn{
    width: 100%;
    border: 1px solid rgba(232, 97, 141, 0.24);
    background: linear-gradient(135deg, rgba(255, 246, 234, 0.96), rgba(255, 236, 245, 0.96));
    color: #9b3055;
    border-radius: 12px;
    padding: 8.5px 10px;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: transform 0.14s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .feed-main-btn:hover{
    background: linear-gradient(135deg, #fff6e8, #ffe9f3);
    box-shadow: 0 6px 14px rgba(232, 97, 141, 0.14);
    transform: translateY(-1px);
  }
  .feed-main-btn:active{
    transform: scale(0.97);
  }
  .candy-pills{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    margin-top: 6.5px;
  }
  .candy-pill{
    border: 1px solid rgba(36, 30, 38, 0.07);
    background: rgba(255, 255, 255, 0.72);
    color: var(--ink-soft);
    border-radius: 9px;
    padding: 5px 2px;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .candy-pill:hover{
    background: #fff;
    color: var(--ink);
  }
  .candy-pill.active{
    background: #fff0f5;
    border-color: rgba(232, 97, 141, 0.55);
    color: #b52e5c;
    font-weight: 600;
    box-shadow: 0 2px 7px rgba(232, 97, 141, 0.14);
  }

  /* 紧凑毛玻璃「五声音乐盒」控制条（融合 V3 风格） */
  .music-bar{
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 18px rgba(36, 30, 38, 0.042);
    padding: 7px 9px;
    margin: 0 2px 7.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .music-bar.playing{
    border-color: rgba(232, 168, 92, 0.68);
    box-shadow: 0 0 0 2px rgba(232, 168, 92, 0.16), 0 8px 20px rgba(232, 97, 141, 0.12);
  }
  .music-btn{
    width: 31px;
    height: 31px;
    border-radius: 10px;
    border: 1px solid rgba(36, 30, 38, 0.07);
    background: rgba(255, 255, 255, 0.88);
    color: var(--ink);
    font-size: 13.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.18s ease;
  }
  .music-btn:hover{
    background: #fff;
    transform: scale(1.05);
    box-shadow: 0 4px 10px rgba(36, 30, 38, 0.08);
  }
  .music-btn:active{
    transform: scale(0.95);
  }
  .music-btn.play-active{
    background: linear-gradient(135deg, #ff99ba, #f4be6a);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(238, 95, 140, 0.36);
    animation: musicGlow 2.2s ease-in-out infinite;
  }
  @keyframes musicGlow{
    0%, 100% { box-shadow: 0 4px 12px rgba(238, 95, 140, 0.34); }
    50% { box-shadow: 0 4px 18px rgba(244, 190, 106, 0.62); }
  }
  .music-center{
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4.5px;
  }
  .music-title-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .music-title{
    font-family: var(--serif);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .music-tag{
    font-size: 9.5px;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .music-leds{
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .music-led{
    flex: 1;
    max-width: 16px;
    height: 5px;
    border-radius: 999px;
    background: rgba(36, 30, 38, 0.10);
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .music-led.lit{
    background: var(--lc, #f288ab);
    transform: scaleY(1.38) scaleX(1.12);
    box-shadow: 0 0 8px var(--lc, #f288ab);
  }

  /* 2x2 Interactive Mode Grid (V3 保留) */
  .tool-row{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6.5px;
    margin: 0 2px 7.5px;
  }
  .tool-btn{
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    border-radius: 13px;
    padding: 8.5px 8px;
    font-family: var(--sans);
    font-size: 11.8px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 5px 14px rgba(36, 30, 38, 0.04);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .tool-btn:hover{
    background: #fff;
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(36, 30, 38, 0.08);
  }
  .tool-btn:active{
    transform: scale(0.96);
  }
  .tool-btn.active{
    background: linear-gradient(135deg, #fff1f6, #fff6e8);
    border-color: rgba(232, 97, 141, 0.58);
    color: #b02e5a;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(232, 97, 141, 0.18);
  }
  .tool-btn.active.firefly-on{
    background: linear-gradient(135deg, #fff9e5, #ffefd6);
    border-color: rgba(214, 152, 48, 0.65);
    color: #995c08;
    box-shadow: 0 6px 16px rgba(214, 152, 48, 0.22);
  }
  .tool-btn.active.zero-g-on{
    background: linear-gradient(135deg, #edf7ff, #f3efff);
    border-color: rgba(114, 142, 232, 0.62);
    color: #3650a8;
    box-shadow: 0 6px 16px rgba(114, 142, 232, 0.20);
  }

  .count-chip{
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    padding: 1px 6px 6.5px;
  }

  button#dump{
    width: calc(100% - 4px);
    margin: 0 2px;
    border: none;
    border-radius: 999px;
    padding: 11px 16px 12px;
    font-family: var(--serif);
    font-style: normal;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.06em;
    cursor: pointer;
    background: linear-gradient(135deg, #ff9dbb 0%, #f2739c 55%, #ee5f8c 100%);
    box-shadow: 0 10px 22px rgba(238, 95, 140, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button#dump:hover{
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 13px 26px rgba(238, 95, 140, 0.42);
  }
  button#dump:active{
    transform: translateY(1px) scale(0.985);
  }
  button#dump.is-full{
    filter: grayscale(0.55) opacity(0.75);
  }
  button#dump .arr{
    font-family: var(--sans);
    font-weight: 400;
    margin-left: 5px;
  }

  /* Custom Jelly Cursor (V3 保留) */
  #cursor-ring{
    position: fixed;
    left: 0;
    top: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.6px solid rgba(242, 136, 171, 0.95);
    z-index: 100;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1);
    transition: background-color 0.12s ease-out, border-color 0.12s ease-out, opacity 0.12s ease-out;
    background: rgba(242, 136, 171, 0);
  }
  #cursor-ring.grabbing{
    background: rgba(242, 136, 171, 0.17);
    border-color: rgba(232, 97, 141, 1);
  }

<script type="module">
/* =========================================================================
   1. 多 CDN 容错加载 Three.js（沿用 V3 实测高速 ES Module 通道 + 本地文件离线兜底）
   ========================================================================= */
const THREE_CDNS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
];

let THREE = null;
let __startedApp = false;

async function loadThree(limitMs = 5500){
  for (const url of THREE_CDNS){
    try {
      const mod = await Promise.race([
        import(url),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), limitMs)),
      ]);
      if (mod && mod.Scene && mod.WebGLRenderer){
        THREE = mod;
        return;
      }
    } catch (err){
      console.warn('[软糖工房] CDN 加载跳过:', url, err && err.message);
    }
  }
  throw new Error('所有公共 CDN 均未能成功加载 Three.js');
}

function startAppOnce(threeLib){
  if (__startedApp) return;
  __startedApp = true;
  try {
    THREE = threeLib;
    init();
    const off = document.getElementById('offline');
    if (off) off.style.display = 'none';
    window.__gummyBooted = true;
  } catch (err){
    __startedApp = false;
    console.error('[软糖工房] 初始化异常:', err);
    showOffline(err);
  }
}

// 支持断网时手动选择本地 three.module.js 或 three.min.js 离线启动
const localInput = document.getElementById('local-three-input');
if (localInput){
  localInput.addEventListener('change', async function(ev){
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    try {
      const blobUrl = URL.createObjectURL(file);
      try {
        const mod = await import(blobUrl);
        if (mod && mod.Scene && mod.WebGLRenderer){
          startAppOnce(mod);
          return;
        }
      } catch (_esmErr){
        // 若非 ES Module，则按 UMD 脚本加载
      } finally {
        URL.revokeObjectURL(blobUrl);
      }
      const text = await file.text();
      const s = document.createElement('script');
      s.textContent = text;
      document.head.appendChild(s);
      if (window.THREE && window.THREE.Scene){
        startAppOnce(window.THREE);
      } else {
        showOffline({ message: '所选文件不是有效的 Three.js 库文件' });
      }
    } catch (err){
      showOffline(err);
    }
  });
}

/* =========================================================================
   2. 基础数学工具 & 双总线防抢音 Web Audio 合成引擎
   ========================================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const safeNum = (v, fallback = 0) => (Number.isFinite(v) ? v : fallback);

function angleDiff(a, b){
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

class JellySound {
  constructor(){
    this.enabled = true;
    this.ctx = null;
    this.masterGain = null;
    this.compressor = null;
    this.sfxGain = null;
    this.musicGain = null;
    this.sfxVoices = 0;
    this.musicVoices = 0;
    this.maxSfxVoices = 6;
    this.maxMusicVoices = 4;
    this.lastPlayedMap = new Map();
  }
  init(){
    if (!this.ctx){
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();

      this.compressor = this.ctx.createDynamicsCompressor();
      this.compressor.threshold.setValueAtTime(-14, this.ctx.currentTime);
      this.compressor.knee.setValueAtTime(18, this.ctx.currentTime);
      this.compressor.ratio.setValueAtTime(6, this.ctx.currentTime);
      this.compressor.attack.setValueAtTime(0.004, this.ctx.currentTime);
      this.compressor.release.setValueAtTime(0.14, this.ctx.currentTime);

      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.enabled ? 1.0 : 0.0;

      // 独立双增益总线：交互音效与八音盒互不抢音、互不触发对方节流
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.75;

      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.46;

      this.sfxGain.connect(this.compressor);
      this.musicGain.connect(this.compressor);
      this.compressor.connect(this.masterGain);
      this.masterGain.connect(this.ctx.destination);
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  }
  setEnabled(flag){
    this.enabled = !!flag;
    if (this.masterGain && this.ctx){
      const now = this.ctx.currentTime;
      this.masterGain.gain.cancelScheduledValues(now);
      this.masterGain.gain.setTargetAtTime(this.enabled ? 1.0 : 0.0, now, 0.018);
    }
  }
  _canPlaySfx(key, minGapMs = 45){
    if (!this.enabled) return false;
    this.init();
    if (!this.ctx || !this.sfxGain) return false;
    if (this.sfxVoices >= this.maxSfxVoices) return false;
    const nowMs = performance.now();
    const prev = this.lastPlayedMap.get(key) || 0;
    if (nowMs - prev < minGapMs) return false;
    this.lastPlayedMap.set(key, nowMs);
    return true;
  }
  _trackSfxVoice(osc){
    this.sfxVoices++;
    osc.onended = () => {
      this.sfxVoices = Math.max(0, this.sfxVoices - 1);
    };
  }
  playBoing(pitch = 1.0, vol = 0.13, sizeScale = 1.0){
    if (!this._canPlaySfx('boing', 45)) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    const sizePitch = clamp(1 / Math.max(0.55, sizeScale), 0.68, 1.45);
    const base = 210 * clamp(pitch, 0.7, 1.5) * sizePitch;
    osc.frequency.setValueAtTime(base * 0.72, now);
    osc.frequency.exponentialRampToValueAtTime(base * 1.44, now + 0.075);
    osc.frequency.exponentialRampToValueAtTime(base * 0.92, now + 0.17);
    osc.frequency.exponentialRampToValueAtTime(base * 1.12, now + 0.27);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(clamp(vol, 0.03, 0.15), now + 0.018);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.30);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    this._trackSfxVoice(osc);
    osc.start(now);
    osc.stop(now + 0.32);
  }
  playPop(pitch = 1.0){
    if (!this._canPlaySfx('pop', 45)) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300 * pitch, now);
    osc.frequency.exponentialRampToValueAtTime(640 * pitch, now + 0.065);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.10, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    this._trackSfxVoice(osc);
    osc.start(now);
    osc.stop(now + 0.13);
  }
  playChime(freq = 523.25, sizeScale = 1.0, vol = 0.11){
    if (!this._canPlaySfx('chime', 45)) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    const sizePitch = clamp(1 / Math.max(0.55, sizeScale), 0.72, 1.42);
    const f = clamp(freq * sizePitch, 220, 1760);
    osc.frequency.setValueAtTime(f * 0.985, now);
    osc.frequency.exponentialRampToValueAtTime(f, now + 0.035);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(clamp(vol, 0.03, 0.14), now + 0.014);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    this._trackSfxVoice(osc);
    osc.start(now);
    osc.stop(now + 0.45);
  }
  playHappyArpeggio(baseFreq = 523.25, sizeScale = 1.0){
    if (!this._canPlaySfx('arp', 120)) return;
    const ratios = [1.0, 1.122, 1.26, 1.5];
    const sizePitch = clamp(1 / Math.max(0.55, sizeScale), 0.74, 1.38);
    const now = this.ctx.currentTime;
    ratios.forEach((r, idx) => {
      if (this.sfxVoices >= this.maxSfxVoices) return;
      const t0 = now + idx * 0.068;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(clamp(baseFreq * r * sizePitch, 240, 1800), t0);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.085, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.28);
      osc.connect(gain);
      gain.connect(this.sfxGain);
      this._trackSfxVoice(osc);
      osc.start(t0);
      osc.stop(t0 + 0.30);
    });
  }
  playNom(sizeScale = 1.0){
    if (!this._canPlaySfx('nom', 60)) return;
    const now = this.ctx.currentTime;
    const sp = clamp(1 / Math.max(0.55, sizeScale), 0.72, 1.40);
    [0, 0.095].forEach((offset, idx) => {
      if (this.sfxVoices >= this.maxSfxVoices) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime((idx === 0 ? 350 : 480) * sp, now + offset);
      osc.frequency.exponentialRampToValueAtTime((idx === 0 ? 235 : 620) * sp, now + offset + 0.08);
      gain.gain.setValueAtTime(0.001, now + offset);
      gain.gain.linearRampToValueAtTime(0.10, now + offset + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.10);
      osc.connect(gain);
      gain.connect(this.sfxGain);
      this._trackSfxVoice(osc);
      osc.start(now + offset);
      osc.stop(now + offset + 0.12);
    });
  }
  playFizzPop(){
    if (!this._canPlaySfx('fizz', 55)) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    const f = rand(520, 960);
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.exponentialRampToValueAtTime(f * 1.65, now + 0.05);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.075, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    this._trackSfxVoice(osc);
    osc.start(now);
    osc.stop(now + 0.10);
  }
  // 果冻八音盒 / 卡林巴纯五声音色（独立 musicGain 通道，标准音准不受体型影响）
  playMusicNote(freq, durSec = 0.55, accent = 1.0){
    if (!this.enabled) return;
    this.init();
    if (!this.ctx || !this.musicGain || this.musicVoices >= this.maxMusicVoices) return;

    const now = this.ctx.currentTime;
    const dur = clamp(durSec, 0.24, 1.45);
    const peak = 0.25 * clamp(accent, 0.55, 1.25);

    const oscFund = this.ctx.createOscillator();
    const oscHarm = this.ctx.createOscillator();
    const harmGain = this.ctx.createGain();
    const envGain = this.ctx.createGain();

    oscFund.type = 'sine';
    oscFund.frequency.setValueAtTime(freq, now);

    oscHarm.type = 'triangle';
    oscHarm.frequency.setValueAtTime(freq * 2, now);
    harmGain.gain.setValueAtTime(0.17, now);

    envGain.gain.setValueAtTime(0.0001, now);
    envGain.gain.linearRampToValueAtTime(peak, now + 0.012);
    envGain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    oscFund.connect(envGain);
    oscHarm.connect(harmGain);
    harmGain.connect(envGain);
    envGain.connect(this.musicGain);

    this.musicVoices++;
    oscFund.onended = () => {
      this.musicVoices = Math.max(0, this.musicVoices - 1);
      oscFund.disconnect();
      oscHarm.disconnect();
      harmGain.disconnect();
      envGain.disconnect();
    };

    oscFund.start(now);
    oscHarm.start(now);
    oscFund.stop(now + dur + 0.03);
    oscHarm.stop(now + dur + 0.03);
  }
}

class PentatonicMusicBox {
  constructor(soundEngine, onNoteCallback){
    this.sound = soundEngine;
    this.onNote = onNoteCallback;
    this.playing = false;
    this.songIndex = 0;
    this.stepIndex = 0;
    this.accum = 0;
    this.beatPhase = 0;
    this.pausedByHidden = false;

    document.addEventListener('visibilitychange', () => {
      if (document.hidden){
        this.pausedByHidden = true;
      } else {
        this.pausedByHidden = false;
        this.accum = 0;
      }
    });
  }
  get currentSong(){
    return PENTATONIC_SONGS[this.songIndex];
  }
  get stepDuration(){
    return (60 / this.currentSong.bpm) * 0.55;
  }
  toggle(){
    this.sound.init();
    this.playing = !this.playing;
    if (this.playing){
      this.accum = this.stepDuration * 0.92;
    }
    return this.playing;
  }
  nextSong(){
    this.songIndex = (this.songIndex + 1) % PENTATONIC_SONGS.length;
    this.stepIndex = 0;
    this.accum = this.playing ? this.stepDuration * 0.90 : 0;
    return this.currentSong;
  }
  update(dt){
    if (!this.playing || this.pausedByHidden) return;
    const safeDt = Math.min(dt, 0.08);
    const stepDur = this.stepDuration;
    this.accum += safeDt;
    this.beatPhase = (this.beatPhase + safeDt / (stepDur * 2)) % 1;

    if (this.accum >= stepDur){
      this.accum -= stepDur;
      if (this.accum > stepDur) this.accum = 0;

      const song = this.currentSong;
      const idx = this.stepIndex;
      const noteIdx = song.notes[idx];
      this.stepIndex = (this.stepIndex + 1) % song.notes.length;

      if (noteIdx >= 0 && noteIdx <= 4){
        const isDownbeat = (idx % 4 === 0);
        const accent = isDownbeat ? 1.08 : 0.92;
        const nextIsRest = song.notes[this.stepIndex] === -1;
        const noteDur = stepDur * (nextIsRest ? 2.45 : 1.55);

        this.sound.playMusicNote(FLAVORS[noteIdx].freq, noteDur, accent);
        if (this.onNote) this.onNote(noteIdx, accent, isDownbeat);
      }
    }
  }
}

   5. V4 瓷盘圆角内壁碰撞限幅（返回碰撞点与法线，1:1 匹配 V4 围壁）
   ========================================================================= */
function clampToTrayRoundedRect(x, z, radius = BODY_RADIUS){
  const r = Math.max(0.15, radius);
  const hx = Math.max(0.45, TRAY_HALF_X - r);
  const hz = Math.max(0.45, TRAY_HALF_Z - r);
  const cr = clamp(TRAY_CORNER_R - r * 0.35, 0.20, Math.min(hx - 0.1, hz - 0.1));

  let cx = clamp(x, -hx, hx);
  let cz = clamp(z, -hz, hz);
  let hitX = (cx !== x);
  let hitZ = (cz !== z);
  let nx = 0, nz = 0;
  if (hitX) nx = x > hx ? -1 : 1;
  if (hitZ) nz = z > hz ? -1 : 1;

  const ix = hx - cr;
  const iz = hz - cr;
  const ax = Math.abs(cx);
  const az = Math.abs(cz);
  if (ax > ix && az > iz){
    const dx = ax - ix;
    const dz = az - iz;
    const dist = Math.hypot(dx, dz);
    if (dist > cr && dist > 1e-6){
      const sx = cx >= 0 ? 1 : -1;
      const sz = cz >= 0 ? 1 : -1;
      cx = sx * (ix + (dx / dist) * cr);
      cz = sz * (iz + (dz / dist) * cr);
      nx = -sx * (dx / dist);
      nz = -sz * (dz / dist);
      hitX = true;
      hitZ = true;
    }
  }
  return { x: cx, z: cz, hit: hitX || hitZ, nx, nz };
}

function makeRoundedRectShape(hw, hh, r){
  const s = new THREE.Shape();
  s.moveTo(-hw + r, -hh);
  s.lineTo(hw - r, -hh);
  s.quadraticCurveTo(hw, -hh, hw, -hh + r);
  s.lineTo(hw, hh - r);
  s.quadraticCurveTo(hw, hh, hw - r, hh);
  s.lineTo(-hw + r, hh);
  s.quadraticCurveTo(-hw, hh, -hw, hh - r);
  s.lineTo(-hw, -hh + r);
  s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  return s;
}

function createTerrazzoTexture(){
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#efe7dc';
  g.fillRect(0, 0, 512, 512);

  let seed = 2026;
  const prng = () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };

  for (let i = 0; i < 2400; i++){
    g.fillStyle = i % 2 === 0 ? 'rgba(195,180,165,0.16)' : 'rgba(255,255,255,0.25)';
    g.fillRect(prng() * 512, prng() * 512, 2, 2);
  }
  const chips = ['#e8b6a6', '#d8c29e', '#a9c7b7', '#b9c8d6', '#d7b7c6', '#c6b4a2', '#f7efe3'];
  for (let i = 0; i < 240; i++){
    const cx = prng() * 512;
    const cy = prng() * 512;
    const r = 3 + prng() * 11;
    const sides = 4 + Math.floor(prng() * 4);
    g.save();
    g.translate(cx, cy);
    g.rotate(prng() * TAU);
    g.beginPath();
    for (let s = 0; s < sides; s++){
      const ang = (s / sides) * TAU;
      const rr = r * (0.62 + prng() * 0.45);
      const px = Math.cos(ang) * rr;
      const py = Math.sin(ang) * rr;
      if (s === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.fillStyle = chips[Math.floor(prng() * chips.length)];
    g.globalAlpha = 0.65;
    g.fill();
    g.restore();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 6);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

    p.gravityScale = gravityScale;

    const ang = Math.random() * TAU;
    const spd = gravityScale < 0.2 ? (0.4 + Math.random() * 0.9) : (1.3 + Math.random() * 2.1);
    const vy = gravityScale < 0.2 ? rand(-0.4, 0.9) : (2.0 + Math.random() * 2.3);
    p.vel.set(Math.cos(ang) * spd, vy, Math.sin(ang) * spd);

    p.mesh.position.set(x, y, z);
    p.mesh.scale.setScalar(p.baseScale);
    p.mesh.material.color.setHex(colorHex);
    p.mesh.material.opacity = 0.88;
    p.mesh.visible = true;
    spawned++;
  }
}

function updateParticles(dt){
  for (const p of particlePool){
    if (!p.active) continue;
    p.life -= dt / p.maxLife;
    if (p.life <= 0){
      p.active = false;
      p.mesh.visible = false;
      continue;
    }
    const g = zeroGravity ? 1.5 : 13.5;
    p.vel.y -= g * p.gravityScale * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    if (p.mesh.position.y < TRAY_FLOOR_Y + 0.05){
      p.mesh.position.y = TRAY_FLOOR_Y + 0.05;
      p.vel.y *= -0.4;
    }
    p.mesh.scale.setScalar(p.baseScale * p.life);
    p.mesh.material.opacity = p.life * 0.85;
  }
}

// V3 几何爱心对象池（仅用于轻抚撸一撸彩蛋）

}

function spawnHeartBurst(x, y, z, count = 4){
  const heartColors = [0xff6b9d, 0xff8fab, 0xffb3c6, 0xffd166];
  let spawned = 0;
  for (let i = 0; i < heartPool.length && spawned < count; i++){
    const h = heartPool[i];
    if (h.active) continue;
    h.active = true;
    h.life = 1.0;
    h.maxLife = 0.95 + Math.random() * 0.35;
    h.baseScale = 0.85 + Math.random() * 0.55;
    h.swayPhase = Math.random() * TAU;

    const ang = (spawned / count) * TAU + Math.random() * 0.7;
    h.vel.set(Math.cos(ang) * 0.55, 1.35 + Math.random() * 0.55, Math.sin(ang) * 0.55);
    h.mesh.position.set(x + Math.cos(ang) * 0.22, y + 0.35, z + Math.sin(ang) * 0.22);
    h.mesh.material.color.setHex(heartColors[spawned % heartColors.length]);
    h.mesh.material.opacity = 0.95;
    h.mesh.scale.setScalar(0.01);
    h.mesh.visible = true;
    spawned++;
  }
}

function updateHearts(dt, elapsed){
  for (const h of heartPool){
    if (!h.active) continue;
    h.life -= dt / h.maxLife;
    if (h.life <= 0){
      h.active = false;
      h.mesh.visible = false;
      continue;
    }
    h.mesh.position.x += (h.vel.x + Math.sin(elapsed * 5 + h.swayPhase) * 0.25) * dt;
    h.mesh.position.y += h.vel.y * dt;
    h.mesh.position.z += h.vel.z * dt;
    h.vel.y *= Math.pow(0.96, dt * 60);

    h.mesh.quaternion.copy(camera.quaternion);
    const popIn = clamp((1.0 - h.life) / 0.18, 0.15, 1.0);
    const sc = h.baseScale * popIn * (0.55 + h.life * 0.55);
    h.mesh.scale.setScalar(sc);
    h.mesh.material.opacity = clamp(h.life * 1.15, 0, 0.92);
  }
}

function spawnMusicNoteSprite(x, y, z, colorHex, sizeScale = 1.0){
  for (let i = 0; i < notePool.length; i++){
    const n = notePool[i];
    if (n.active) continue;
    n.active = true;
    n.life = 0;
    n.maxLife = 1.05 + Math.random() * 0.30;
    n.phase = Math.random() * TAU;
    n.mat.color.set(colorHex);
    n.mat.opacity = 0.96;
    n.sprite.position.set(
      x + rand(-0.24, 0.24),
      y + 0.85 * sizeScale,
      z + rand(-0.24, 0.24)
    );
    n.vel.set(rand(-0.28, 0.28), 1.05 + Math.random() * 0.32, rand(-0.28, 0.28));
    n.sprite.scale.setScalar(0.32);
    n.sprite.visible = true;
    break;
  }

function updateNotes(dt){
  for (const n of notePool){
    if (!n.active) continue;
    n.life += dt;
    if (n.life >= n.maxLife){
      n.active = false;
      n.sprite.visible = false;
      continue;
    }
    const t = n.life / n.maxLife;
    n.sprite.position.addScaledVector(n.vel, dt);
    n.sprite.position.x += Math.sin(t * 6.5 + n.phase) * 0.011;
    const sc = t < 0.18 ? lerp(0.18, 0.45, t / 0.18) : lerp(0.45, 0.30, (t - 0.18) / 0.82);
    n.sprite.scale.setScalar(sc);
    n.mat.opacity = t < 0.55 ? 0.96 : 0.96 * (1 - (t - 0.55) / 0.45);
  }
}

/* =========================================================================
   8. 双模态萤火逗宠棒（地面水平面 + 失重垂直相机视线 3D 平面 + floorRing）
   ========================================================================= */
function initFirefly(){
  fireflyState.pos = new THREE.Vector3(0, 1.05, 0);
  fireflyState.target = new THREE.Vector3(0, 1.05, 0);

  const g = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.14, 18, 16),
    new THREE.MeshBasicMaterial({ color: 0xfff5be })
  );
  g.add(core);

  const haloMat = new THREE.SpriteMaterial({
    map: glowTex,
    color: 0xffdf7d,
    transparent: true,
    opacity: 0.88,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const halo = new THREE.Sprite(haloMat);
  halo.scale.setScalar(1.32);
  g.add(halo);

  const light = new THREE.PointLight(0xffcf56, 2.2, 6.4, 1.6);
  g.add(light);

  g.visible = false;
  scene.add(g);

  // 失重高度深度参考环：紧贴瓷盘釉面 y = TRAY_FLOOR_Y + 0.042
  const ringGeo = new THREE.RingGeometry(0.28, 0.35, 44);
  ringGeo.rotateX(-Math.PI / 2);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xf6d884,
    transparent: true,
    opacity: 0.44,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  const floorRing = new THREE.Mesh(ringGeo, ringMat);
  floorRing.position.set(0, TRAY_FLOOR_Y + 0.042, 0);
  floorRing.visible = false;
  scene.add(floorRing);

  fireflyState.group = g;
  fireflyState.halo = halo;
  fireflyState.light = light;
  fireflyState.floorRing = floorRing;
  fireflyState.floorRingMat = ringMat;
}

function updateFirefly(dt, elapsed){
  const shouldShow = fireflyMode && !grab && !orbitDrag && !pointerOverUI && !pinchState;
  fireflyState.active = shouldShow;
  if (!fireflyState.group) return;

  fireflyState.group.visible = shouldShow;
  if (fireflyState.floorRing){
    fireflyState.floorRing.visible = !!(zeroGravity && shouldShow);
  }
  if (!shouldShow) return;

  const safeX = clamp(mouse.px, 30, Math.max(120, window.innerWidth - rightPanelSafeMarginPx));
  const safeY = clamp(mouse.py, 30, window.innerHeight - 30);
  const ndc = ndcFromClient(safeX, safeY);
  _raycaster.setFromCamera(_ndcVec.set(ndc.x, ndc.y), camera);

  if (!zeroGravity){
    const hit = _raycaster.ray.intersectPlane(_planeFirefly, _hitPt);
    if (hit){
      const cl = clampToTrayRoundedRect(hit.x, hit.z, 0.48);
      fireflyState.target.set(cl.x, 0.95, cl.z);
    }
  } else {
    // 失重真 3D 平面：始终垂直于当前相机视线，过太空舱中心 (0, 2.75, 0)
    camera.getWorldDirection(_camDir);
    _planeFirefly3D.setFromNormalAndCoplanarPoint(_camDir, _zeroGCenter);
    const hit = _raycaster.ray.intersectPlane(_planeFirefly3D, _hitPt);
    if (hit){
      const cl = clampToTrayRoundedRect(hit.x, hit.z, 0.48);
      const cy = clamp(hit.y, TRAY_FLOOR_Y + 0.72, ZERO_G_CEILING_Y - 0.65);
      fireflyState.target.set(cl.x, cy, cl.z);
    }
  }

  const prevX = fireflyState.pos.x;
  const prevY = fireflyState.pos.y;
  const prevZ = fireflyState.pos.z;
  const k = 1 - Math.exp(-13 * dt);
  fireflyState.pos.lerp(fireflyState.target, k);

  const bobY = Math.sin(elapsed * 4.8) * 0.09;
  const bobX = Math.cos(elapsed * 3.2) * 0.04;
  fireflyState.group.position.set(
    fireflyState.pos.x + bobX,
    fireflyState.pos.y + bobY,
    fireflyState.pos.z
  );

  const pulse = 1.24 + Math.sin(elapsed * 8.2) * 0.18;
  fireflyState.halo.scale.setScalar(pulse);
  fireflyState.light.intensity = 2.0 + Math.sin(elapsed * 8.2) * 0.38;

  // 更新盘面高度深度参考环
  if (fireflyState.floorRing && fireflyState.floorRing.visible){
    fireflyState.floorRing.position.set(fireflyState.pos.x, TRAY_FLOOR_Y + 0.042, fireflyState.pos.z);
    const hNorm = clamp((fireflyState.pos.y - TRAY_FLOOR_Y) / (ZERO_G_CEILING_Y - TRAY_FLOOR_Y), 0, 1);
    fireflyState.floorRing.scale.setScalar(0.75 + hNorm * 1.05);
    fireflyState.floorRingMat.opacity = clamp(0.56 - hNorm * 0.34, 0.14, 0.56);
  }

  const moveSpd = Math.hypot(
    fireflyState.pos.x - prevX,
    fireflyState.pos.y - prevY,
    fireflyState.pos.z - prevZ
  ) / Math.max(dt, 0.008);
  if (moveSpd > 2.3 && elapsed - fireflyState.lastSparkleAt > 0.09){
    fireflyState.lastSparkleAt = elapsed;
    spawnJellyParticles(fireflyState.pos.x, fireflyState.pos.y + bobY, fireflyState.pos.z, 0xffe072, 1, 0.15);
  }
}

/* =========================================================================
   9. V4 六角恐龙模型 + V3 3D 弹性物理容器（JellyAxolotlPet）
   ========================================================================= */
function computeSwarmOffset(uid){
  const goldenAngle = 2.399963229728653;
  const y = clamp(0.68 - ((uid % 7) / 6) * 1.28, -0.72, 0.72);
  const r = Math.sqrt(Math.max(0.05, 1 - y * y));
  const theta = uid * goldenAngle;
  return new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r).normalize();
}

class JellyAxolotlPet {
  constructor(flavor, x, z, yaw, y, dropVel){
    this.uid = petUidCounter++;
    this.flavor = flavor;
    this.id = Math.random().toString(36).slice(2, 8);

    this.sizeScale = 1.0;
    this.targetSizeScale = 1.0;

    // 物理状态（y 为脚底触盘高度）
    this.pos = { x, y, z };
    this.vel = { x: 0, y: -(dropVel || 0), z: 0 };
    this.yaw = yaw;
    this.yawVel = 0;
    this.pitch = 0;
    this.roll = 0;

    this.floatY = clamp(1.55 + (this.uid % 5) * 0.56, 1.25, 4.35);
    this.swarmOffset = computeSwarmOffset(this.uid);

    // 弹性挤压与 V3 3D 方向拉扯弹簧
    this.squashPos = 0;
    this.squashVel = 0;
    this.pullVec = new THREE.Vector3(0, 0, 0);
    this.pullVel = new THREE.Vector3(0, 0, 0);
    this.pullBiasZ = 0;

    // 互动与状态计时器
    this.isGrabbed = false;
    this.squishAmt = 0;
    this.currentStrain = 0;
    this.phase = Math.random() * TAU;
    this.onFloor = false;
    this.lastLandSound = 0;

    // 彩虹波纹变色 & 跳跳狂欢
    this.colorRipple = null;
    this.fizzTimer = 0;
    this.fizzPulseTimer = 0;

    // V3 轻抚撸一撸状态
    this.rubEnergy = 0;
    this.rubCooldown = 0;
    this.rubHappyTimer = 0;
    this.happyTimer = 0;
    this.eatHappyTimer = 0;

    // 自然眨眼
    this.blinkTimer = rand(1.8, 5.2);
    this.blinkDur = 0;

    // 五声果冻小乐团合唱视觉层状态
    this.singPulse = 0;
    this.pendingSingTimer = -1;
    this.pendingSingAccent = 1.0;
    this.musicBounceTimer = 0;
    this.nodPulse = 0;

    // P6 慵懒惬意型双阶段自主生态
    this.idleMode = (this.uid % 2 === 0) ? 'rest' : 'stroll';
    this.idleModeTimer = rand(2.2, 5.4);
    this.idleTarget = { x, z };
    this.idleLookBias = 0;
    this.lazyHopTimer = rand(6.5, 11.5);
    this._pickNewLazyTarget();

    this.chaseCandy = null;
    this.curAiState = 'P6';
    this.tailBend = 0;
    this.tailBendVel = 0;
    this.headTiltX = 0;
    this.headTiltY = 0;

    this._buildModel(flavor);
    this.updateVisuals(0.016, 0, 0);
  }

  get colRadius(){
    return BODY_RADIUS * this.sizeScale;
  }

  get floorRestY(){
    return TRAY_FLOOR_Y;
  }

  _makeJellyMat(hexColor, deepColor, opacity = 0.94){
    return new THREE.MeshPhysicalMaterial({
      color: hexColor,
      emissive: new THREE.Color(hexColor).multiplyScalar(0.06),
      roughness: 0.12,
      metalness: 0.0,
      transmission: 0.14,
      thickness: 1.45,
      ior: 1.42,
      attenuationColor: new THREE.Color(deepColor),
      attenuationDistance: 1.35,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      sheen: 0.25,
      sheenRoughness: 0.35,
      sheenColor: new THREE.Color(0xffffff),
      transparent: true,
      opacity,
    });
  }

  _buildModel(flavor){
    this.root = new THREE.Group();
    this.root.rotation.order = 'YXZ'; // 保证 yaw -> pitch -> roll 绝不发生万向锁

    this.stretchOuter = new THREE.Group();
    this.stretchInner = new THREE.Group();
    this.bodyPivot = new THREE.Group();
    this.root.add(this.stretchOuter);
    this.stretchOuter.add(this.stretchInner);
    this.stretchInner.add(this.bodyPivot);
    this.bodyPivot.scale.setScalar(MODEL_BASE_SCALE);

    this.headMat = this._makeJellyMat(flavor.color, flavor.deep, 0.95);
    this.torsoMat = this._makeJellyMat(flavor.color, flavor.deep, 0.94);
    this.tailMat = this._makeJellyMat(flavor.color, flavor.deep, 0.90);
    this.gillMat = this._makeJellyMat(flavor.gill, flavor.gillDeep, 0.96);
    this.coreMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(flavor.color),
      emissiveIntensity: 0.48,
      roughness: 0.18,
      transparent: true,
      opacity: 0.78,
    });
    this.eyeMat = new THREE.MeshStandardMaterial({ color: 0x221b18, roughness: 0.12 });
    this.specMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    this.blushMat = new THREE.MeshBasicMaterial({ color: 0xff6e96, transparent: true, opacity: 0.42 });
    this.smileMat = new THREE.MeshStandardMaterial({ color: 0x3b2622, roughness: 0.35 });

    this.pickMeshes = [];
    const registerPick = (mesh, partTag, castShadow = true) => {
      mesh.userData.pet = this;
      mesh.userData.partTag = partTag;
      mesh.castShadow = castShadow;
      this.pickMeshes.push(mesh);
      return mesh;
    };

    // 1. 躯干与内部发光糖芯
    this.torsoMesh = registerPick(new THREE.Mesh(sharedGeos.torso, this.torsoMat), 'body');
    this.torsoMesh.position.set(0, 0.34, -0.05);
    this.bodyPivot.add(this.torsoMesh);

    this.coreCandy = new THREE.Mesh(sharedGeos.coreCandy, this.coreMat);
    this.coreCandy.position.set(0, 0.35, -0.04);
    this.bodyPivot.add(this.coreCandy);

    // 2. 头部组（圆润头、高光眼、腮红、微笑嘴、唱歌小圆嘴、左右 3 支羽毛外鳃）
    this.headGroup = new THREE.Group();
    this.headGroup.position.set(0, 0.42, 0.36);
    this.bodyPivot.add(this.headGroup);

    const headMesh = registerPick(new THREE.Mesh(sharedGeos.head, this.headMat), 'head');
    this.headGroup.add(headMesh);

    this.eyeMeshes = [];
    for (const side of [-1, 1]){
      const eye = new THREE.Mesh(sharedGeos.eye, this.eyeMat);
      eye.position.set(side * 0.21, 0.05, 0.34);
      this.headGroup.add(eye);
      this.eyeMeshes.push(eye);

      const spec = new THREE.Mesh(sharedGeos.eyeSpec, this.specMat);
      spec.position.set(side * 0.195, 0.072, 0.388);
      this.headGroup.add(spec);

      const blush = new THREE.Mesh(sharedGeos.blush, this.blushMat);
      blush.position.set(side * 0.27, -0.04, 0.28);
      this.headGroup.add(blush);
    }

    const smileMesh = new THREE.Mesh(sharedGeos.smile, this.smileMat);
    smileMesh.position.set(0, -0.03, 0.385);
    smileMesh.rotation.z = Math.PI + 0.24;
    this.headGroup.add(smileMesh);
    this.smileMesh = smileMesh;

    // 唱歌小圆嘴（复用 this.smileMat，免额外销毁）
    this.singMouth = new THREE.Mesh(sharedGeos.singMouth, this.smileMat);
    this.singMouth.position.set(0, -0.055, 0.392);
    this.singMouth.scale.set(0.95, 1.15, 0.75);
    this.singMouth.visible = false;
    this.headGroup.add(this.singMouth);

    this.gillGroups = [];
    for (const side of [-1, 1]){
      const gHolder = new THREE.Group();
      gHolder.position.set(side * 0.38, 0.04, 0.02);
      this.headGroup.add(gHolder);
      this.gillGroups.push({ group: gHolder, side });

      const angles = [0.42, 0.02, -0.38];
      for (let k = 0; k < 3; k++){
        const branch = new THREE.Group();
        branch.rotation.z = side * (Math.PI * 0.5 - 0.18) + angles[k] * side;
        branch.rotation.y = -side * (0.28 + k * 0.12);
        const stalk = registerPick(new THREE.Mesh(sharedGeos.gillStalk, this.gillMat), 'head');
        stalk.position.y = 0.12;
        branch.add(stalk);

        for (let f = 0; f < 3; f++){
          const frond = new THREE.Mesh(sharedGeos.gillFrond, this.gillMat);
          frond.position.set((f - 1) * 0.04, 0.14 + f * 0.055, 0.02);
          frond.scale.set(0.9, 1.15, 0.7);
          branch.add(frond);
        }
        gHolder.add(branch);
      }
    }

    // 3. 尾巴与半透明背尾鳍
    this.tailGroup = new THREE.Group();
    this.tailGroup.position.set(0, 0.31, -0.40);
    this.bodyPivot.add(this.tailGroup);

    const tailMesh = registerPick(new THREE.Mesh(sharedGeos.tail, this.tailMat), 'tail');
    tailMesh.position.set(0, 0, -0.34);
    this.tailGroup.add(tailMesh);

    this.finMat = new THREE.MeshPhysicalMaterial({
      color: flavor.gill,
      emissive: new THREE.Color(flavor.gill).multiplyScalar(0.16),
      roughness: 0.14,
      transparent: true,
      opacity: 0.74,
      side: THREE.DoubleSide,
    });
    const finMesh = new THREE.Mesh(sharedGeos.fin, this.finMat);
    finMesh.position.set(0, 0.13, -0.30);
    finMesh.rotation.y = Math.PI / 2;
    finMesh.rotation.x = 0.18;
    this.tailGroup.add(finMesh);

    // 4. 四只小短腿
    this.legs = [];
    const legCoords = [
      [-0.27, 0.14, 0.12],
      [0.27, 0.14, 0.12],
      [-0.25, 0.14, -0.24],
      [0.25, 0.14, -0.24],
    ];
    legCoords.forEach((p, idx) => {
      const leg = registerPick(new THREE.Mesh(sharedGeos.leg, this.torsoMat), 'body');
      leg.position.set(p[0], p[1], p[2]);
      leg.rotation.z = p[0] < 0 ? 0.38 : -0.38;
      this.bodyPivot.add(leg);
      this.legs.push({ mesh: leg, idx, side: p[0] < 0 ? -1 : 1 });
    });

    scene.add(this.root);

    // 5. 瓷盘底部彩色透光焦散光斑
    this.decalMat = new THREE.MeshBasicMaterial({
      map: glowTex,
      color: flavor.color,
      transparent: true,
      opacity: 0.34,
      depthWrite: false,
    });
    this.decal = new THREE.Mesh(sharedGeos.decal, this.decalMat);
    this.decal.position.set(this.pos.x, TRAY_FLOOR_Y + 0.015, this.pos.z);
    this.decal.renderOrder = -1;
    scene.add(this.decal);
  }

  _pickNewLazyTarget(){
    const margin = Math.max(0.75, this.colRadius + 0.32);
    const rx = rand(-(TRAY_HALF_X - margin), TRAY_HALF_X - margin);
    const rz = rand(-(TRAY_HALF_Z - margin), TRAY_HALF_Z - margin);
    const cl = clampToTrayRoundedRect(rx, rz, margin);
    this.idleTarget.x = cl.x;
    this.idleTarget.z = cl.z;
  }

  // 头 -> 鳃 -> 躯干 -> 尾 彩虹波纹渐变换色（含深色果味吸收 attenuationColor 同步渐变）
  startColorRipple(nextFlavor){
    this.flavor = nextFlavor;
    this.colorRipple = {
      elapsed: 0,
      duration: 0.92,
      fromBody: this.torsoMat.color.clone(),
      fromBodyAtten: this.torsoMat.attenuationColor.clone(),
      fromGill: this.gillMat.color.clone(),
      fromGillAtten: this.gillMat.attenuationColor.clone(),
      fromDecal: this.decalMat.color.clone(),
      toBody: new THREE.Color(nextFlavor.color),
      toBodyAtten: new THREE.Color(nextFlavor.deep),
      toGill: new THREE.Color(nextFlavor.gill),
      toGillAtten: new THREE.Color(nextFlavor.gillDeep),
    };
  }

  _updateColorRipple(dt){
    if (!this.colorRipple) return;
    const r = this.colorRipple;
    r.elapsed += dt;
    const p = clamp(r.elapsed / r.duration, 0, 1);

    const tHead = clamp(p * 1.45, 0, 1);
    const tTorso = clamp((p - 0.22) * 1.45, 0, 1);
    const tTail = clamp((p - 0.45) * 1.45, 0, 1);

    this.headMat.color.copy(r.fromBody).lerp(r.toBody, tHead);
    this.headMat.attenuationColor.copy(r.fromBodyAtten).lerp(r.toBodyAtten, tHead);
    this.gillMat.color.copy(r.fromGill).lerp(r.toGill, tHead);
    this.gillMat.attenuationColor.copy(r.fromGillAtten).lerp(r.toGillAtten, tHead);
    this.torsoMat.color.copy(r.fromBody).lerp(r.toBody, tTorso);
    this.torsoMat.attenuationColor.copy(r.fromBodyAtten).lerp(r.toBodyAtten, tTorso);
    this.coreMat.emissive.copy(this.torsoMat.color);
    this.tailMat.color.copy(r.fromBody).lerp(r.toBody, tTail);
    this.tailMat.attenuationColor.copy(r.fromBodyAtten).lerp(r.toBodyAtten, tTail);
    this.finMat.color.copy(r.fromGill).lerp(r.toGill, tTail);
    this.decalMat.color.copy(r.fromDecal).lerp(r.toBody, tTorso);

    if (tTail >= 1){
      this.colorRipple = null;
    }
  }

  eatCandy(candy){
    this.squashVel += 5.4;
    this.eatHappyTimer = 0.95;
    this.happyTimer = 1.25;
    if (!zeroGravity){
      this.vel.y = Math.max(this.vel.y, 2.8);
      this.onFloor = false;
    }

    if (candy.type === 'rainbow'){
      const candidates = FLAVORS.filter(f => f.id !== this.flavor.id);
      const nextFlavor = candidates[(Math.random() * candidates.length) | 0];
      const oldName = this.flavor.name;
      this.startColorRipple(nextFlavor);
      sfx.playHappyArpeggio(nextFlavor.freq, this.sizeScale);
      showToast(`🌈 ${oldName}吃下彩虹糖，波纹变身成「${nextFlavor.name}」！`);
    } else if (candy.type === 'fizz'){
      this.fizzTimer = 5.0;
      this.fizzPulseTimer = 0.0;
      this.chaseCandy = null;
      sfx.playHappyArpeggio(this.flavor.freq * 1.15, this.sizeScale);
      showToast(`⚡ ${this.flavor.name}吃下跳跳气泡糖，糖分飙升啦！`);
    } else if (candy.type === 'size'){
      if (this.targetSizeScale > 1.15){
        this.targetSizeScale = 0.72;
        showToast(`⭐ ${this.flavor.name}变成了袖珍口袋软糖！`);
      } else if (this.targetSizeScale < 0.88){
        this.targetSizeScale = 1.0;
        showToast(`⭐ ${this.flavor.name}恢复了标准身材！`);
      } else {
        this.targetSizeScale = 1.36;
        showToast(`⭐ ${this.flavor.name}膨胀成巨无霸软糖啦！`);
      }
      sfx.playChime(this.flavor.freq, this.targetSizeScale, 0.13);
    } else {
      this.coreMat.emissive.setHex(candy.color);
      sfx.playNom(this.sizeScale);
    }
  }

  // V3 原味轻抚撸一撸：眯眼 + 腮红 + 旋转小跳 + 几何爱心 + 五声琶音（绝不出现音符）
  triggerRubHappy(){
    this.rubEnergy = 0;
    this.rubCooldown = 3.2;
    this.rubHappyTimer = 0.95;
    this.happyTimer = 1.4;
    this.chaseCandy = null;
    this.squashVel += 6.2;
    this.yawVel += (Math.random() > 0.5 ? 1 : -1) * 5.8;
    if (!zeroGravity){
      this.vel.y = Math.max(this.vel.y, 3.6);
      this.onFloor = false;
    } else {
      this.vel.y += 1.4;
    }
    spawnHeartBurst(this.pos.x, this.pos.y + 0.55 * this.sizeScale, this.pos.z, 4);
    sfx.playHappyArpeggio(this.flavor.freq, this.sizeScale);
    showToast(`${this.flavor.name}被撸得眯起眼睛啦 ♡`);
  }

  triggerHop(strength = 1.0){
    this.singPulse = 1.0;
    if (!this.isGrabbed){
      spawnMusicNoteSprite(this.pos.x, this.pos.y, this.pos.z, this.flavor.uiHex, this.sizeScale);
    }
    if (zeroGravity){
      this.vel.y += 2.0 * strength;
      this.yawVel += rand(-2.8, 2.8);
    } else {
      this.vel.y = Math.max(this.vel.y, 4.4 * strength / Math.sqrt(this.sizeScale));
      this.onFloor = false;
    }
    this.squashVel += 6.8 * strength;
    this.happyTimer = 1.1;
  }

  scheduleSing(delaySec, accent = 1.0){
    if (delaySec <= 0.001){
      this.triggerSing(accent);
    } else {
      this.pendingSingTimer = delaySec;
      this.pendingSingAccent = accent;
    }
  }

  triggerSing(accent = 1.0){
    this.singPulse = 1.0;
    this.musicBounceTimer = 0.42;
    this.squashVel += 3.8 * accent;

    if (!this.isGrabbed){
      spawnMusicNoteSprite(this.pos.x, this.pos.y, this.pos.z, this.flavor.uiHex, this.sizeScale);
    }

    const canChorusMove = !this.isGrabbed && this.fizzTimer <= 0 && this.rubHappyTimer <= 0 &&
      this.curAiState !== 'P4' && this.curAiState !== 'P5';

    if (canChorusMove){
      if (!zeroGravity){
        if (this.onFloor){
          this.vel.y = Math.max(this.vel.y, 2.85 / Math.sqrt(this.sizeScale));
          this.onFloor = false;
        }
        const toCamYaw = Math.atan2(camera.position.x - this.pos.x, camera.position.z - this.pos.z);
        this.yaw += angleDiff(this.yaw, toCamYaw) * 0.24;
      } else {
        const spinDir = (this.uid % 2 === 0 ? 1 : -1) * (Math.random() < 0.7 ? 1 : -1);
        this.yawVel += spinDir * 2.5;
        if (this.pos.y < ZERO_G_CEILING_Y - 1.05){
          this.vel.y += 0.95;
        }
        this.floatY = clamp(this.pos.y + 0.12, TRAY_FLOOR_Y + 0.55, ZERO_G_CEILING_Y - 0.85);
      }
    }
  }

  stepRenderTimers(dt){
    if (this.pendingSingTimer >= 0){
      this.pendingSingTimer -= dt;
      if (this.pendingSingTimer <= 0){
        this.pendingSingTimer = -1;
        this.triggerSing(this.pendingSingAccent);
      }
    }
    if (this.singPulse > 0) this.singPulse = Math.max(0, this.singPulse - dt / 0.38);
    if (this.musicBounceTimer > 0) this.musicBounceTimer = Math.max(0, this.musicBounceTimer - dt);
    if (this.nodPulse > 0) this.nodPulse = Math.max(0, this.nodPulse - dt / 0.32);
  }

  stepPhysics(dt, elapsed, grabTarget){
    this.sizeScale = lerp(this.sizeScale, this.targetSizeScale, clamp(dt * 5.2, 0, 1));
    const restY = this.floorRestY;
    const radius = this.colRadius;

    if (this.rubCooldown > 0) this.rubCooldown = Math.max(0, this.rubCooldown - dt);
    if (this.rubEnergy > 0) this.rubEnergy = Math.max(0, this.rubEnergy - dt * 95);
    if (this.fizzTimer > 0) this.fizzTimer = Math.max(0, this.fizzTimer - dt);
    if (this.rubHappyTimer > 0) this.rubHappyTimer = Math.max(0, this.rubHappyTimer - dt);
    if (this.happyTimer > 0) this.happyTimer = Math.max(0, this.happyTimer - dt);
    if (this.eatHappyTimer > 0) this.eatHappyTimer = Math.max(0, this.eatHappyTimer - dt);

    // =====================================================================
    // 严格单轨 AI 优先级状态机：P1 > P2 > P3 > P4 > P5 > P5.5 > P6
    // =====================================================================
    let state = 'P6';
    if (this.isGrabbed && grabTarget){
      state = 'P1';
    } else if (this.fizzTimer > 0){
      state = 'P2';
    } else if (this.rubHappyTimer > 0){
      state = 'P3';
    } else if (this.chaseCandy){
      state = 'P4';
    } else if (fireflyMode && fireflyState.active){
      state = 'P5';
    } else if (musicBox.playing && (this.singPulse > 0.05 || this.musicBounceTimer > 0)){
      state = 'P5.5';
    }
    this.curAiState = state;

    let overridePitch = null;
    let isLazyStrolling = false;
    let lazyStrollSpd = 0;

    if (state === 'P1'){
      // --- P1: 玩家抓取拉扯 ---
      this.chaseCandy = null;
      this.rubEnergy = 0;

      const dx = safeNum(grabTarget.x - this.pos.x);
      const dy = safeNum(grabTarget.y - this.pos.y);
      const dz = safeNum(grabTarget.z - this.pos.z);

      const followRate = 13.5;
      this.vel.x = lerp(this.vel.x, dx * followRate, clamp(dt * 14, 0, 1));
      this.vel.y = lerp(this.vel.y, dy * followRate, clamp(dt * 14, 0, 1));
      this.vel.z = lerp(this.vel.z, dz * followRate, clamp(dt * 14, 0, 1));

      this.pos.x += this.vel.x * dt;
      this.pos.y += this.vel.y * dt;
      this.pos.z += this.vel.z * dt;

      const worldPullX = dx * 0.94;
      const worldPullY = dy * 0.94 + (zeroGravity ? 0.04 : 0.16);
      const worldPullZ = dz * 0.94;
      const c = Math.cos(-this.yaw), s = Math.sin(-this.yaw);
      const locX = worldPullX * c + worldPullZ * s;
      const locZ = -worldPullX * s + worldPullZ * c;
      const locY = worldPullY;

      const rawLen = Math.hypot(locX, locY, locZ);
      const maxStretch = 1.18;
      const clampedLen = rawLen > 1e-4 ? maxStretch * Math.tanh(rawLen / maxStretch) : 0;
      const scaleF = rawLen > 1e-4 ? clampedLen / rawLen : 0;

      this.pullVec.x = lerp(this.pullVec.x, locX * scaleF, clamp(dt * 16, 0, 1));
      this.pullVec.y = lerp(this.pullVec.y, locY * scaleF, clamp(dt * 16, 0, 1));
      this.pullVec.z = lerp(this.pullVec.z, locZ * scaleF, clamp(dt * 16, 0, 1));
      this.pullVel.set(0, 0, 0);

      if (this.squishAmt > 0.02){
        this.squashVel -= this.squishAmt * 28 * dt;
      }

      this.yawVel = lerp(this.yawVel, clamp(-locX * 1.4, -2.5, 2.5), dt * 5);
      this.yaw += this.yawVel * dt;
      this.onFloor = false;
    } else {
      if (state === 'P2'){
        // --- P2: 跳跳糖狂欢 ---
        this.chaseCandy = null;
        this.fizzPulseTimer -= dt;
        if (this.fizzPulseTimer <= 0){
          this.fizzPulseTimer = 0.44;
          const ang = Math.random() * TAU;
          const spd = zeroGravity ? rand(3.2, 5.2) : rand(4.2, 6.6);
          this.vel.x = Math.sin(ang) * spd;
          this.vel.z = Math.cos(ang) * spd;
          this.vel.y = zeroGravity ? rand(-2.2, 2.6) : rand(3.8, 5.6);
          this.yawVel = rand(-6.0, 6.0);
          this.squashVel += 7.2;
          this.onFloor = false;
          spawnJellyParticles(this.pos.x, this.pos.y + 0.35, this.pos.z, this.flavor.color, 3, zeroGravity ? 0.12 : 1.0);
          sfx.playFizzPop();
        }
      } else if (state === 'P3'){
        // --- P3: V3 被撸开心定格旋转 ---
        this.chaseCandy = null;
        this.yawVel = lerp(this.yawVel, 4.2, clamp(dt * 6, 0, 1));
      } else if (state === 'P4' && this.chaseCandy){
        // --- P4: 追吃魔法糖豆（地面 / 失重真 3D） ---
        const cPos = this.chaseCandy.pos;
        const dx = cPos.x - this.pos.x;
        const dy = cPos.y - (this.pos.y + 0.25 * this.sizeScale);
        const dz = cPos.z - this.pos.z;
        const distXZ = Math.hypot(dx, dz);
        const desiredYaw = Math.atan2(dx, dz);
        this.yaw += clamp(angleDiff(this.yaw, desiredYaw), -6.8 * dt, 6.8 * dt);

        if (zeroGravity){
          const dist3 = Math.hypot(dx, dy, dz) || 1;
          const swimThrust = 9.2;
          this.vel.x += (dx / dist3) * swimThrust * dt;
          this.vel.y += (dy / dist3) * swimThrust * dt;
          this.vel.z += (dz / dist3) * swimThrust * dt;
          overridePitch = clamp(-Math.atan2(dy, Math.max(0.35, distXZ)), -0.78, 0.78);
        } else if (this.onFloor && distXZ > 0.55){
          const hopSpd = clamp(distXZ * 1.45, 2.3, 4.8);
          this.vel.x = Math.sin(this.yaw) * hopSpd;
          this.vel.z = Math.cos(this.yaw) * hopSpd;
          this.vel.y = 2.65;
          this.squashVel += 4.2;
          this.onFloor = false;
        }
      } else if (state === 'P5'){
        // --- P5: 萤火追光（地面平面围观 vs 失重真 3D 全向球形围观 + 俯仰游姿） ---
        const fPos = fireflyState.pos;
        if (zeroGravity){
          const orbitR = 1.05 * this.sizeScale + 0.25;
          const rawGx = fPos.x + this.swarmOffset.x * orbitR;
          const rawGy = fPos.y + this.swarmOffset.y * orbitR;
          const rawGz = fPos.z + this.swarmOffset.z * orbitR;

          const clampedG = clampToTrayRoundedRect(rawGx, rawGz, radius + 0.15);
          const goalY = clamp(rawGy, TRAY_FLOOR_Y + 0.35, ZERO_G_CEILING_Y - 0.85 * this.sizeScale);

          const dx = clampedG.x - this.pos.x;
          const dy = goalY - this.pos.y;
          const dz = clampedG.z - this.pos.z;
          const dist3 = Math.hypot(dx, dy, dz);

          const lookDx = dist3 < 0.55 ? (fPos.x - this.pos.x) : dx;
          const lookDy = dist3 < 0.55 ? (fPos.y - this.pos.y) : dy;
          const lookDz = dist3 < 0.55 ? (fPos.z - this.pos.z) : dz;
          const lookHoriz = Math.hypot(lookDx, lookDz);

          if (lookHoriz > 0.04){
            const desiredYaw = Math.atan2(lookDx, lookDz);
            this.yaw += clamp(angleDiff(this.yaw, desiredYaw), -6.5 * dt, 6.5 * dt);
          }
          overridePitch = clamp(-Math.atan2(lookDy, Math.max(0.35, lookHoriz)), -0.82, 0.82);

          if (dist3 >= 0.45){
            const inv3 = 1 / dist3;
            const thrust = clamp(dist3 * 4.2, 2.2, 7.6) / Math.pow(this.sizeScale, 0.2);
            this.vel.x += dx * inv3 * thrust * dt;
            this.vel.y += dy * inv3 * thrust * dt;
            this.vel.z += dz * inv3 * thrust * dt;
          } else {
            const hoverDamp = Math.pow(0.88, dt * 60);
            this.vel.x *= hoverDamp;
            this.vel.y *= hoverDamp;
            this.vel.z *= hoverDamp;
          }
        } else {
          const dx = fPos.x - this.pos.x;
          const dz = fPos.z - this.pos.z;
          const distXZ = Math.hypot(dx, dz);
          const desiredYaw = Math.atan2(dx, dz);
          this.yaw += clamp(angleDiff(this.yaw, desiredYaw), -6.2 * dt, 6.2 * dt);

          const stopDist = 1.05 * this.sizeScale + 0.22;
          if (this.onFloor){
            this.lazyHopTimer -= dt * 2.2;
            if (distXZ > stopDist){
              const hopSpd = clamp((distXZ - stopDist * 0.7) * 1.35, 1.8, 4.1);
              this.vel.x = Math.sin(this.yaw) * hopSpd;
              this.vel.z = Math.cos(this.yaw) * hopSpd;
              this.vel.y = 2.35;
              this.squashVel += 3.6;
              this.onFloor = false;
            } else if (this.lazyHopTimer <= 0){
              this.vel.y = 1.85;
              this.squashVel += 3.0;
              this.onFloor = false;
              this.lazyHopTimer = rand(0.95, 1.85);
            }
          }
        }
      } else if (state === 'P5.5'){
        // --- P5.5: 乐团节拍唱跳期间保持队形 ---
        if (!zeroGravity){
          this.vel.x *= Math.pow(0.88, dt * 60);
          this.vel.z *= Math.pow(0.88, dt * 60);
        }
      } else {
        // --- P6: B. 慵懒惬意型自主活体生态 ---
        const beingPetted = (this.rubEnergy > 12) || (!fireflyMode && hoverAx === this);
        if (beingPetted){
          this.idleMode = 'rest';
          this.idleLookBias = lerp(this.idleLookBias, 0, clamp(dt * 4, 0, 1));
        } else if (zeroGravity){
          // 失重态：全舱缓慢巡游 + 柔和浮沉
          this.idleModeTimer -= dt;
          if (this.idleModeTimer <= 0){
            this.idleModeTimer = rand(3.8, 7.0);
            this._pickNewLazyTarget();
            this.floatY = rand(1.15, ZERO_G_CEILING_Y - 1.15 * this.sizeScale);
          }
          const dx = this.idleTarget.x - this.pos.x;
          const dz = this.idleTarget.z - this.pos.z;
          const dist = Math.hypot(dx, dz);
          if (dist > 0.55){
            const desiredYaw = Math.atan2(dx, dz);
            this.yaw += clamp(angleDiff(this.yaw, desiredYaw), -2.2 * dt, 2.2 * dt);
            const cruiseSpd = 0.52;
            this.vel.x = lerp(this.vel.x, Math.sin(this.yaw) * cruiseSpd, clamp(dt * 2.2, 0, 1));
            this.vel.z = lerp(this.vel.z, Math.cos(this.yaw) * cruiseSpd, clamp(dt * 2.2, 0, 1));
          }
        } else if (this.onFloor){
          // 地面态：惬意歇息 (rest) ⇄ 慢悠悠踱步 (stroll)
          this.idleModeTimer -= dt;
          if (this.idleModeTimer <= 0){
            if (this.idleMode === 'rest'){
              // 音乐盒播放时更倾向原地伴舞，减少远走欲望
              const wantStroll = musicBox.playing ? (Math.random() < 0.35) : (Math.random() < 0.72);
              if (wantStroll){
                this.idleMode = 'stroll';
                this.idleModeTimer = rand(2.4, 4.4);
                this._pickNewLazyTarget();
              } else {
                this.idleModeTimer = rand(3.5, 6.2);
                this.idleLookBias = rand(-0.34, 0.34);
              }
            } else {
              this.idleMode = 'rest';
              this.idleModeTimer = rand(3.8, 6.8);
              this.idleLookBias = rand(-0.28, 0.28);
            }
          }

          if (this.idleMode === 'stroll'){
            const dx = this.idleTarget.x - this.pos.x;
            const dz = this.idleTarget.z - this.pos.z;
            const dist = Math.hypot(dx, dz);
            if (dist < 0.42){
              this.idleMode = 'rest';
              this.idleModeTimer = rand(3.6, 6.5);
              this.idleLookBias = rand(-0.26, 0.26);
            } else {
              const desiredYaw = Math.atan2(dx, dz);
              this.yaw += clamp(angleDiff(this.yaw, desiredYaw), -2.4 * dt, 2.4 * dt);
              isLazyStrolling = true;
              lazyStrollSpd = 0.82 / Math.sqrt(this.sizeScale);
              this.idleLookBias = lerp(this.idleLookBias, 0, clamp(dt * 3, 0, 1));
            }
          } else {
            // 歇息态低频偶发原地惬意轻跳
            this.lazyHopTimer -= dt;
            if (this.lazyHopTimer <= 0){
              if (Math.random() < 0.35 && wobble > 0.08 && !musicBox.playing){
                this.vel.y = (1.5 + Math.random() * 1.4) * Math.min(1.25, 0.5 + wobble * 0.5);
                this.squashVel += 3.8;
                this.onFloor = false;
              }
              this.lazyHopTimer = rand(7.0, 12.0);
            }
          }
        }
      }

      // 物理积分（地面重力 vs 失重悬浮弹簧解耦）
      if (zeroGravity){
        const disableFloatSpring = (state === 'P2' || state === 'P4' || state === 'P5');
        const floatK = disableFloatSpring ? 0 : 2.45;
        if (floatK > 0){
          const targetFloatY = clamp(
            this.floatY + Math.sin(elapsed * 1.45 + this.phase) * 0.24,
            restY + 0.32,
            ZERO_G_CEILING_Y - 0.92 * this.sizeScale
          );
          this.vel.y += (targetFloatY - this.pos.y) * floatK * dt;
        }

        const spaceDamp = Math.pow(0.958, dt * 60);
        this.vel.x *= spaceDamp;
        this.vel.y *= spaceDamp;
        this.vel.z *= spaceDamp;
        this.yawVel += Math.sin(elapsed * 0.8 + this.phase) * 0.16 * dt;
        this.yawVel *= Math.pow(0.96, dt * 60);
      } else {
        this.vel.y -= GRAVITY * dt;
        const airDamp = Math.pow(0.92, dt * 60);
        this.vel.x *= airDamp;
        this.vel.z *= airDamp;
        this.yawVel *= Math.pow(0.92, dt * 60);
      }

      const maxSpd = zeroGravity ? 11.5 : 26;
      const spd = Math.hypot(this.vel.x, this.vel.y, this.vel.z);
      if (spd > maxSpd){
        const sc = maxSpd / spd;
        this.vel.x *= sc; this.vel.y *= sc; this.vel.z *= sc;
      }

      this.pos.x += this.vel.x * dt;
      this.pos.y += this.vel.y * dt;
      this.pos.z += this.vel.z * dt;
      this.yaw += this.yawVel * dt;

      // 松手后 3D 拉扯弹簧回弹
      const pullStiff = 128;
      const pullDamp = lerp(9.0, 4.4, clamp(wobble / 2, 0, 1));
      this.pullVel.x += (-pullStiff * this.pullVec.x - pullDamp * this.pullVel.x) * dt;
      this.pullVel.y += (-pullStiff * this.pullVec.y - pullDamp * this.pullVel.y) * dt;
      this.pullVel.z += (-pullStiff * this.pullVec.z - pullDamp * this.pullVel.z) * dt;
      this.pullVec.addScaledVector(this.pullVel, dt);
      if (this.pullVec.lengthSq() < 1e-6 && this.pullVel.lengthSq() < 1e-6){
        this.pullVec.set(0, 0, 0);
        this.pullVel.set(0, 0, 0);
      }
      this.squishAmt = lerp(this.squishAmt, 0, dt * 10);
    }

    // 3. 陶瓷盘底与失重隐形顶棚限位（保留 V3 落盘弹跳与五声音阶音效）
    const floorLimit = zeroGravity ? (restY + 0.14) : restY;
    if (this.pos.y <= floorLimit){
      const impact = -this.vel.y;
      this.pos.y = floorLimit;
      if (zeroGravity){
        if (this.vel.y < 0) this.vel.y = -this.vel.y * 0.45;
        this.onFloor = false;
      } else if (impact > 1.3){
        const restitution = 0.36 + 0.14 * clamp(wobble, 0, 1.5);
        this.vel.y = impact * restitution;
        this.squashVel -= clamp(impact * 1.55, 2.0, 14.5);
        this.onFloor = false;
        if (impact > 4.0){
          spawnJellyParticles(this.pos.x, TRAY_FLOOR_Y + 0.12, this.pos.z, this.flavor.color, 5);
        }
        if (impact > 3.0 && elapsed - this.lastLandSound > 0.18){
          this.lastLandSound = elapsed;
          sfx.playBoing(0.88 + Math.random() * 0.25, clamp(impact * 0.013, 0.04, 0.14), this.sizeScale);
          if (impact > 6.2){
            sfx.playChime(this.flavor.freq, this.sizeScale, 0.075);
          }
        }
      } else {
        this.vel.y = 0;
        this.onFloor = true;
      }
      if (!zeroGravity){
        const fric = Math.pow(0.84, dt * 60);
        this.vel.x *= fric;
        this.vel.z *= fric;
        // 摩擦之后应用慵懒慢踱步（短腿划步配合，绝不滑冰）
        if (isLazyStrolling && this.onFloor){
          const targetVx = Math.sin(this.yaw) * lazyStrollSpd;
          const targetVz = Math.cos(this.yaw) * lazyStrollSpd;
          this.vel.x = lerp(this.vel.x, targetVx, clamp(dt * 8, 0, 1));
          this.vel.z = lerp(this.vel.z, targetVz, clamp(dt * 8, 0, 1));
        }
      }
    } else {
      this.onFloor = false;
    }

    const ceilLimit = zeroGravity ? (ZERO_G_CEILING_Y - 0.82 * this.sizeScale) : 9.5;
    if (this.pos.y > ceilLimit){
      this.pos.y = ceilLimit;
      if (this.vel.y > 0) this.vel.y *= -0.42;
    }

    // 退出追光或吃完糖后同步 floatY，防止突兀回弹
    if (zeroGravity && !this.isGrabbed && (state === 'P2' || state === 'P4' || state === 'P5')){
      this.floatY = clamp(this.pos.y, restY + 0.25, ceilLimit - 0.15);
    }

    // 4. V4 立体陶瓷盘沿内壁动态半径反弹（防止 P6 慵懒踱步蹭墙）
    const clamped = clampToTrayRoundedRect(this.pos.x, this.pos.z, radius);
    if (clamped.hit){
      this.pos.x = clamped.x;
      this.pos.z = clamped.z;
      const vn = this.vel.x * clamped.nx + this.vel.z * clamped.nz;
      if (vn < 0){
        const bounce = -vn * 1.45;
        this.vel.x += clamped.nx * bounce;
        this.vel.z += clamped.nz * bounce;
        this.squashVel -= clamp(-vn * 0.72, 1.0, 6.5);
        if (-vn > 3.5){
          spawnJellyParticles(this.pos.x, this.pos.y + 0.3, this.pos.z, this.flavor.color, 4);
        }
      }
      if (state === 'P6' && this.idleMode === 'stroll'){
        this.idleMode = 'rest';
        this.idleModeTimer = rand(3.5, 6.2);
      }
    }

    // 5. 垂直挤压弹簧步进
    const fizzJitter = this.fizzTimer > 0 ? Math.sin(elapsed * 32 + this.phase) * 0.10 : 0;
    const strollBob = isLazyStrolling ? Math.abs(Math.sin(elapsed * 6.5 + this.phase)) * 0.025 : 0;
    const idleJiggle = Math.sin(elapsed * 3.1 + this.phase) * 0.018 * wobble + fizzJitter + strollBob;
    const sqStiff = 115;
    const sqDamp = lerp(9.2, 4.2, clamp(wobble / 2, 0, 1));
    const targetSq = -clamp(this.squishAmt * 0.22, 0, 0.62) + idleJiggle;
    const sqAcc = -sqStiff * (this.squashPos - targetSq) - sqDamp * this.squashVel;
    this.squashVel += sqAcc * dt;
    this.squashPos += this.squashVel * dt;
    this.squashPos = clamp(this.squashPos, -0.58, 0.62);

    // 6. 俯仰侧倾与甩尾惯性（失重 3D 追光/追糖时直接采用 overridePitch，不被覆盖）
    const c = Math.cos(-this.yaw), s = Math.sin(-this.yaw);
    const locVelX = this.vel.x * c + this.vel.z * s;
    const locVelZ = -this.vel.x * s + this.vel.z * c;

    const spaceTilt = zeroGravity ? Math.sin(elapsed * 1.2 + this.phase) * 0.14 : 0;
    const spaceRoll = zeroGravity ? Math.cos(elapsed * 1.0 + this.phase) * 0.13 : 0;
    const targetPitch = (overridePitch !== null)
      ? overridePitch
      : clamp(-this.vel.y * 0.045 + locVelZ * 0.02 + spaceTilt, -0.52, 0.52);

    this.pitch = lerp(this.pitch, targetPitch, clamp(dt * 8.0, 0, 1));
    this.roll = lerp(this.roll, clamp(-locVelX * 0.055 + spaceRoll, -0.48, 0.48), clamp(dt * 8.0, 0, 1));

    const tailTarget = clamp(-locVelX * 0.14 - this.yawVel * 0.25, -0.65, 0.65);
    this.tailBendVel += (-72 * (this.tailBend - tailTarget) - 6.5 * this.tailBendVel) * dt;
    this.tailBend += this.tailBendVel * dt;

    // 自然眨眼更新
    if (this.blinkDur > 0){
      this.blinkDur = Math.max(0, this.blinkDur - dt);
    } else {
      this.blinkTimer -= dt;
      if (this.blinkTimer <= 0){
        this.blinkDur = 0.16;
        this.blinkTimer = rand(2.4, 5.8);
      }
    }

    this.currentStrain = Math.max(this.pullVec.length() * 0.72, Math.abs(this.squashPos) * 0.95);

    if (!Number.isFinite(this.pos.x) || !Number.isFinite(this.pos.y) || !Number.isFinite(this.pos.z)){
      this.pos.x = 0; this.pos.y = restY + 0.5; this.pos.z = 0;
      this.vel.x = 0; this.vel.y = 0; this.vel.z = 0;
      this.pullVec.set(0, 0, 0); this.pullVel.set(0, 0, 0);
    }
  }

  updateVisuals(dt, elapsed, beatPhase){
    // 1. 先执行头 -> 鳃 -> 躯干 -> 尾彩虹波纹变色
    this._updateColorRipple(dt);

    // 2. 在 _updateColorRipple 之后统一叠加自发光系数（与彩虹波纹变色零冲突）
    const bodyEm = 0.06 + this.singPulse * 0.26;
    const gillEm = 0.10 + this.singPulse * 0.26;
    this.headMat.emissive.copy(this.headMat.color).multiplyScalar(bodyEm);
    this.torsoMat.emissive.copy(this.torsoMat.color).multiplyScalar(bodyEm);
    this.tailMat.emissive.copy(this.tailMat.color).multiplyScalar(bodyEm);
    this.gillMat.emissive.copy(this.gillMat.color).multiplyScalar(gillEm);
    this.finMat.emissive.copy(this.finMat.color).multiplyScalar(gillEm);

    // 3. 唱歌小圆嘴与微笑嘴切换
    const isSingingMouth = this.singPulse > 0.25;
    this.smileMesh.visible = !isSingingMouth;
    this.singMouth.visible = isSingingMouth;
    if (isSingingMouth){
      const mScale = 0.65 + this.singPulse * 0.68;
      this.singMouth.scale.set(0.95 * mScale, 1.15 * mScale, 0.75);
    }

    // 4. 变换与 V3 3D 体积守恒拉伸容器更新
    const singJiggle = this.singPulse * 0.075 * Math.sin(this.singPulse * Math.PI * 3);
    const sy = clamp(1 + this.squashPos * 0.46 + singJiggle, 0.54, 1.48);
    const sxz = 1 / Math.sqrt(sy);

    this.root.position.set(this.pos.x, this.pos.y, this.pos.z);
    this.root.rotation.set(this.pitch, this.yaw, this.roll, 'YXZ');

    const pullLen = this.pullVec.length();
    if (pullLen > 0.002){
      _v1.copy(this.pullVec).divideScalar(pullLen);
      _qPull.setFromUnitVectors(_upVec, _v1);
      _qInv.copy(_qPull).invert();

      const stretchAxis = 1 + clamp(pullLen * 0.58, 0, 0.80);
      const shrinkCross = 1 / Math.sqrt(stretchAxis);

      this.stretchOuter.quaternion.copy(_qPull);
      this.stretchOuter.scale.set(shrinkCross, stretchAxis, shrinkCross);
      this.stretchInner.quaternion.copy(_qInv);
    } else {
      this.stretchOuter.quaternion.identity();
      this.stretchOuter.scale.set(1, 1, 1);
      this.stretchInner.quaternion.identity();
    }

    const sc = MODEL_BASE_SCALE * this.sizeScale;
    this.bodyPivot.scale.set(sc * sxz, sc * sy, sc * sxz);

    // 5. 腮红浓淡与眯眼表情（拉扯 / 按扁 / 刚吃糖 / 被撸开心）
    const targetBlush = (this.rubHappyTimer > 0 || this.rubEnergy > 45) ? 0.80 : 0.42;
    this.blushMat.opacity = lerp(this.blushMat.opacity, targetBlush, clamp(dt * 8, 0, 1));
